[project]
name = "experiment-metrics"
version = "0.1.0"
description = "Lightweight run-level metric collection for OpenFOAM experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.40.0",
]

[project.scripts]
experiment-metrics = "experiment_metrics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
package = true

[tool.experiment-metrics.bigquery]
project = "apac-hpc-ai-tokyo-rapids-26"
dataset = "experiment_metrics"
table = "metrics"
location = "asia-northeast1"

# Canonical v2 ownership graph. The compact [[producers]]/[[keys]] projection
# above is consumed by the current Recorder API; registry loading requires it
# to agree exactly with these producer/source/fact declarations.
[contract]
schema_version = "openfoam-observation-contract/v1"
repository_id = "apac2026-openfoam"

[artifact_roles]
run_bundle = "run-artifacts.tar.zst"
profile_raw = "profile-raw.tar.zst"
artifact_manifest = "artifact-manifest.json"
run_bundle_source_roles = [
  "block_mesh_log",
  "build_provision_validation",
  "build_raw",
  "build_sidecar",
  "check_mesh_log",
  "decompose_par_log",
  "host_exec_environment",
  "imb_mpi1_argv",
  "imb_mpi1_stderr",
  "imb_mpi1_stdout",
  "instrumentation_bundle",
  "job_entry",
  "job_entry_environment",
  "minimal_hardware",
  "official_result",
  "pjm_log",
  "postrun_source",
  "pstream_source",
  "rank_placement",
  "run_manifest",
  "scheduler_accounting",
  "scheduler_accounting_stderr",
  "scheduler_accounting_stdout",
  "scheduler_request",
  "scheduler_submission_result",
  "scheduler_submission_stderr",
  "scheduler_submission_stdout",
  "scheduler_terminal",
  "solver_log",
  "workload_manifest",
  "workload_member",
]

[[producer]]
id = "runner.manifest"
owner_scope = "run"
applicable_run_variants = ["bench", "profile"]
activation = { kind = "always" }
instances = { kind = "singleton" }


[protocol]
schema_version = "openfoam-v2-run-protocol/v2"
workload_definition = "../../benchmark/workload.json"

[variant.bench]
nodes = 4
ranks = 448
resource_group = "a-batch"
transport_policy = "shm:ofi"
transport_environment = { I_MPI_FABRICS = "shm:ofi" }
expected_stages = ["case_prepare", "renumber_mesh", "potential_foam", "apply_boundary_layer", "rank_placement", "solver", "minimal_hardware_capture", "network_imb_mpi1"]

[variant.profile]
nodes = 4
ranks = 448
resource_group = "a-batch"
transport_policy = "shm:ofi"
transport_environment = { I_MPI_FABRICS = "shm:ofi" }
expected_stages = ["case_prepare", "renumber_mesh", "potential_foam", "apply_boundary_layer", "solver", "minimal_hardware_capture", "profile_hardware_capture", "network_imb_mpi1"]

name: ASPIRE-2A decomposition visualization

# 一時的な可視化用ジョブ（Issue #39）。4ノードrunの512分割を3通り（ケース既定のhierarchical (16 8 4)、Basicのscotch、最終Bonusの
# multiLevel (4 2 4 16)）作り、各セルのサブ領域番号（cellDist）を車体表面と断面へ抜き出す
# （presentation/openfoam/decomposition/decomposition.pbs）。分割は計測runと同じBasicのビルドのdecomposeParで作り、各runの
# decomposePar.logと照合する。共有ノード1台の直列ジョブで、計測はしない。出力はhome-labの成果物保管庫へ置き、作業ディレクトリを
# 削除する。画像を作り終えたら、このworkflowは削除する。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aspire2a-decomposition-visualization

jobs:
  visualize:
    name: 3通りの512分割を作って車体表面と断面へ抜き出す
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 1440
    defaults:
      run:
        shell: aspire2a-shell --github-shell {0}
    env:
      # 計測runが使ったBasicのビルド（OpenFOAM 5a55da3f、ThirdParty 1eb94326、UCX、GCC 11.2、AOCL-LibM）。
      BUILD_ARCHIVE: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/builds/37888149985.tar.zst
      MESH_ARCHIVE: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/workload/polyMesh_65M.tar.gz
      OPENFOAM_ARTIFACT_ARCHIVE_ROOT: /hdd_raid/samba/net_share/openfoam-artifacts
    steps:
      - name: スクリプトとケースを取得
        uses: actions/checkout@v7

      - name: スクリプト、ケース、ビルドを作業ディレクトリへ置く
        run: |
          work="/scratch/users/industry/ai-hpc/apacsc14/openfoam/decomposition-visualization/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "WORK=${work}" >> "${GITHUB_ENV}"
          mkdir -p "${work}/collect"
          cp -a submission/openfoam/run benchmark/occDrivAerStaticMesh presentation/openfoam/decomposition "${work}/"
          platforms/aspire2a/stage-openfoam-runtime.sh "${BUILD_ARCHIVE}" "${BUILD_ARCHIVE%.tar.zst}.build-sidecar.json" "${work}/build-basic"
          cp "${BUILD_ARCHIVE%.tar.zst}.build-sidecar.json" "${work}/collect/build-sidecar.json"

      - name: ジョブを投入
        run: |
          case_dir="${WORK}/case"
          echo "CASE_DIR=${case_dir}" >> "${GITHUB_ENV}"
          job=$(qsub -P 59000014 -N decomposition-viz -o "${WORK}/collect/job-output.log" -v "SCRIPT_DIR=${WORK}/run,OPENFOAM_DIR=${WORK}/build-basic,CASE_SOURCE=${WORK}/occDrivAerStaticMesh,MESH_ARCHIVE=${MESH_ARCHIVE},CASE_DIR=${case_dir},SURFACES_DICT=${WORK}/decomposition/decompositionSurfaces" "${WORK}/decomposition/decomposition.pbs")
          printf '%s\n' "${job}" | tee "${WORK}/collect/job.txt"
          echo "WAIT_JOBS=${job}" >> "${GITHUB_ENV}"

      - name: 実行の終了を待つ
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while true; do
            if accounting=$(aspire2a-shell qstat -fx ${WAIT_JOBS}); then failures=0; else failures=$((failures + 1)); [[ "${failures}" -lt 12 ]] || exit 1; sleep 60; continue; fi
            state=$(awk '/job_state = / {print $3}' <<< "${accounting}")
            echo "${state}"
            if [[ "${state}" == F ]]; then break; fi
            sleep 60
          done
          awk '/Exit_status = / {print $3}' <<< "${accounting}" | tee /dev/stderr | grep -qx 0

      - name: 出力とログをまとめる
        if: (success() || failure()) && env.WAIT_JOBS != ''
        run: |
          collect="${WORK}/collect"
          qstat -fx ${WAIT_JOBS} > "${collect}/pbs.txt" 2>&1 || true
          cp -a "${CASE_DIR}/logFiles" "${CASE_DIR}/postProcessing" "${CASE_DIR}/system/decompositionSurfaces" "${CASE_DIR}/system/include/caseDefinition" "${collect}/" || true
          tar -C "${collect}" -cf - . | zstd -q -T4 -o "${WORK}/decomposition-visualization.tar.zst"
          ls -la "${WORK}/decomposition-visualization.tar.zst"
          du -sh "${collect}"/postProcessing/decomposition/* || true

      - name: 出力をhome-labの成果物保管庫へ置く
        if: (success() || failure()) && env.WAIT_JOBS != ''
        shell: home-lab-shell {0}
        run: |
          destination="${OPENFOAM_ARTIFACT_ARCHIVE_ROOT}/${GITHUB_RUN_ID}/aspire2a/decomposition-visualization"
          install -d -m 0750 "${destination}"
          aspire2a-shell --pull "${WORK}/decomposition-visualization.tar.zst" "${destination}"
          ls -la "${destination}"
          printf '### Decomposition visualization outputs\n\n- https://mizuha-dev.com/files/openfoam-artifacts/%s/aspire2a/decomposition-visualization/decomposition-visualization.tar.zst\n' "${GITHUB_RUN_ID}" >> "${GITHUB_STEP_SUMMARY}"

      - name: 作業ディレクトリを削除
        if: always() && env.WORK != ''
        run: |
          if [[ -n "${WAIT_JOBS:-}" ]]; then qdel ${WAIT_JOBS} 2>/dev/null || true; fi
          rm -rf -- "${WORK:?}"

name: Recover Issue 33 ASPIRE-2A artifacts

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  recover:
    name: Package and archive completed PBS run
    runs-on: [self-hosted, home-lab]
    defaults:
      run:
        shell: aspire2a-shell --github-shell {0}
    env:
      RUN_ID: r-a60900bb9922e25d13aa7397c670e1ae
      RUN_DIR: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/runs/runs/r-a60900bb9922e25d13aa7397c670e1ae
      PROVISION_DIR: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/provision/run-35947810650-1.561mlX9r
      PBS_JOB_ID: 25530701.pbs101
      OPENFOAM_SOURCE_OID: a292ac290edd63f3a77b07f8fac88d408399afcd
    steps:
      - name: Verify completed diagnostic and package existing raw output
        env:
          METRICS_CREDENTIAL_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
        run: |
          run_manifest="${RUN_DIR}/control/run-manifest.json"
          protocol="${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2-protocol-aspire2a-multilevel-4n-512r.toml"
          tool="${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics"
          test -f "${RUN_DIR}/run-success"
          test -x "${tool}"
          grep -qx 'STATUS: DIAGNOSTIC' "${RUN_DIR}/results/result.txt"
          test "$(find "${RUN_DIR}/profile/raw/mpi-temporal" -maxdepth 1 -name 'rank-*-phases.tsv' | wc -l)" -eq 512
          jq -e --arg oid "${OPENFOAM_SOURCE_OID}" 'any(.source_commits[]; .commit_role == "openfoam_source" and .oid == $oid)' "${RUN_DIR}/control/build-sidecar.json" >/dev/null
          accounting=$(qstat -xf "${PBS_JOB_ID}")
          test "$(sed -n 's/^[[:space:]]*job_state = //p' <<< "${accounting}")" = F
          test "$(sed -n 's/^[[:space:]]*Exit_status = //p' <<< "${accounting}")" = 0
          test -n "${METRICS_CREDENTIAL_JSON}"
          credential_file=$(mktemp "/tmp/openfoam-bigquery-recover-${GITHUB_RUN_ID}.XXXXXXXX.json")
          printf '%s' "${METRICS_CREDENTIAL_JSON}" > "${credential_file}"
          trap 'rm -f -- "${credential_file}"' EXIT
          export EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE="${credential_file}"
          export EXPERIMENT_METRICS_BIGQUERY_CONFIG="${PROVISION_DIR}/experiment-metrics/pyproject.toml"
          "${tool}" record-pbs-terminal --manifest "${run_manifest}" --runtime-dir "${RUN_DIR}" --protocol "${protocol}" --job-id "${PBS_JOB_ID}"
          "${tool}" record-execution-context --manifest "${run_manifest}" --runtime-dir "${RUN_DIR}" --protocol "${protocol}" --host-snapshot "${RUN_DIR}/source/env/host-exec.snapshot" --placement-root "${RUN_DIR}/source/placement" --scheduler-request "${RUN_DIR}/control/scheduler-request.json" --scheduler-accounting "${RUN_DIR}/control/scheduler-accounting.json" --decompose-dict "${RUN_DIR}/source/mesh/decomposeParDict" --solver-log "${RUN_DIR}/logs/solver.log"
          args=(package --manifest "${run_manifest}")
          for pair in 'control/run-manifest.json:run_manifest' 'control/instrumentation-bundle.json:instrumentation_bundle' 'control/build-sidecar.json:build_sidecar' 'control/build-provision-validation.json:build_provision_validation' 'control/job-entry.json:job_entry' 'control/scheduler-accounting.json:scheduler_accounting' 'control/scheduler-request.json:scheduler_request' 'control/scheduler-terminal.json:scheduler_terminal' 'control/submission-result.json:scheduler_submission_result' 'logs/checkMesh.log:check_mesh_log' 'logs/imb-mpi1-ldd.log:postrun_source' 'logs/mpi-rank-affinity-ldd.log:postrun_source' 'logs/minimal-hardware-capture.log:postrun_source' 'logs/profile-hardware-capture.log:postrun_source' 'logs/rank-placement.log:postrun_source' 'logs/decomposePar.log:decompose_par_log' 'logs/renumberMesh.log:renumber_mesh_log' 'logs/potentialFoam.log:potential_foam_log' 'logs/applyBoundaryLayer.log:apply_boundary_layer_log' 'logs/profile-warmup.log:postrun_source' 'logs/pbs.log:pbs_log' 'logs/solver.log:solver_log' 'results/coefficient.dat:force_coefficients' 'results/coefficient-source.json:postrun_source' 'source/env/host-exec.snapshot:host_exec_environment' 'source/env/job-entry.snapshot:job_entry_environment' 'source/network/imb-mpi1/argv.json:imb_mpi1_argv' 'source/network/imb-mpi1/stderr.txt:imb_mpi1_stderr' 'source/network/imb-mpi1/stdout.txt:imb_mpi1_stdout' 'source/scheduler/accounting.stderr:scheduler_accounting_stderr' 'source/scheduler/accounting.stdout:scheduler_accounting_stdout' 'source/scheduler/submission.stderr:scheduler_submission_stderr' 'source/scheduler/submission.stdout:scheduler_submission_stdout'; do relative=${pair%%:*}; [[ -f "${RUN_DIR}/${relative}" ]] && args+=(--member "${pair}"); done
          args+=(--member 'results/result.txt:postrun_source')
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:rank_placement"); done < <(find "${RUN_DIR}/source/placement" -type f -name 'rank-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:minimal_hardware"); done < <(find "${RUN_DIR}/source/hardware" -type f -name 'node-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:postrun_source"); done < <(find "${RUN_DIR}/source/hardware" -type f ! -name 'node-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:postrun_source"); done < <(find "${RUN_DIR}/source/mesh" "${RUN_DIR}/source/build-provision" -type f -print0 | sort -z)
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:build_raw"); done < <(find "${RUN_DIR}/control/build-raw" -type f -print0 | sort -z)
          args+=(--member 'source/workload-manifest.json:workload_manifest')
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:workload_member"); done < <(find "${RUN_DIR}/source/workload" -type f -print0 | sort -z)
          while IFS= read -r -d '' path; do args+=(--profile-member "${path#"${RUN_DIR}/"}"); done < <(find "${RUN_DIR}/profile/raw" -type f -print0 | sort -z)
          "${tool}" "${args[@]}"
          "${tool}" send-fragments --manifest "${run_manifest}" --runtime-dir "${RUN_DIR}"
          test -s "${RUN_DIR}/artifact-manifest.json"
          test -s "${RUN_DIR}/run-artifacts.tar.zst"
          test -s "${RUN_DIR}/profile-raw.tar.zst"

      - name: Retrieve packaged output
        shell: home-lab-shell {0}
        run: |
          destination="${RUNNER_TEMP}/issue33-recovery"
          aspire2a-shell --pull "${RUN_DIR}/artifact-manifest.json" "${destination}"
          aspire2a-shell --pull "${RUN_DIR}/run-artifacts.tar.zst" "${destination}"
          aspire2a-shell --pull "${RUN_DIR}/profile-raw.tar.zst" "${destination}"
          aspire2a-shell --pull "${RUN_DIR}/results" "${destination}"

      - name: Upload recovered output
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-aspire2a-recovery-r-a60900bb9922e25d13aa7397c670e1ae
          path: |
            ${{ runner.temp }}/issue33-recovery/artifact-manifest.json
            ${{ runner.temp }}/issue33-recovery/run-artifacts.tar.zst
            ${{ runner.temp }}/issue33-recovery/profile-raw.tar.zst
            ${{ runner.temp }}/issue33-recovery/results/result.txt
          if-no-files-found: error
          compression-level: 0

      - name: Archive recovered output on home server
        shell: home-lab-shell {0}
        run: |
          destination="/hdd_raid/samba/net_share/openfoam-artifacts/${GITHUB_RUN_ID}/aspire2a/openfoam-aspire2a-recovery-${RUN_ID}"
          install -d -m 0750 "${destination}"
          cp -a "${RUNNER_TEMP}/issue33-recovery/." "${destination}/"

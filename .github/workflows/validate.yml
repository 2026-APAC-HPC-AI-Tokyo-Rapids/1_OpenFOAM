name: Validate OpenFOAM control plane

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation inputs
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Validate shell syntax
        run: find scripts platforms -type f \( -name '*.sh' -o -name '*.pjm' -o -name '*.pbs' \) -print0 | xargs -0 -r -n1 bash -n

      - name: Run unit tests
        run: uv run --project experiment-metrics pytest -q experiment-metrics/tests tests

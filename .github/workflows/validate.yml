name: OpenFOAM制御処理の検証

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 検証対象を取得
        uses: actions/checkout@v7

      - name: uvを導入
        uses: astral-sh/setup-uv@v7

      - name: シェル構文を検証
        run: find scripts platforms -type f \( -name '*.sh' -o -name '*.pjm' -o -name '*.pbs' \) -print0 | xargs -0 -r -n1 bash -n

      - name: 単体テストを実行
        run: uv run --project experiment-metrics pytest -q experiment-metrics/tests tests

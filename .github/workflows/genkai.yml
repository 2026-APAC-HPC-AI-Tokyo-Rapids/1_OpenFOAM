name: OpenFOAM on genkai

on:
  workflow_dispatch:
    inputs:
      require_build:
        description: Build from source instead of reusing the nearest build archive from the first-parent history
        required: true
        default: false
        type: boolean
      reshare_ccache:
        description: Build from source and republish local ccache hits to remote storage
        required: true
        default: false
        type: boolean
      profile_mode:
        description: Run directly or opt in to perf stat or VTune hotspots profiling
        required: true
        default: direct
        type: choice
        options:
          - direct
          - perf-stat
          - vtune-hotspots
      nodes:
        description: Allocated nodes while keeping the total MPI rank count at 120
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
  push:
    paths-ignore:
      - 'research/**'
      - '**/.md'

permissions:
  actions: read
  contents: read

env:
  BUILD_ARCHIVE_DIR: /home/pj26000080/share/openfoam-build/builds
  GIT_MIRROR_DIR: /fast/pj26000080/git-mirror

defaults:
  run:
    shell: bash --login -eo pipefail {0}

jobs:
  select-build:
    name: Select OpenFOAM build
    runs-on: [self-hosted, genkai]

    outputs:
      action: ${{ steps.select.outputs.action }}
      prepare_script_sha256: ${{ steps.prepare_identity.outputs.sha256 }}
      source_run_number: ${{ steps.select.outputs.source_run_number }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identify case preparation
        id: prepare_identity
        run: echo "sha256=$(sha256sum scripts/prepare-openfoam-case.sh | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Select an existing archive or a new build
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ '${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[require-build]')) || (github.event_name == 'workflow_dispatch' && (inputs.require_build || inputs.reshare_ccache)) }}' == true ]]; then
            echo "A new OpenFOAM build was explicitly requested"
            echo "action=build" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          commit="${GITHUB_SHA}"
          while [[ -n "${commit}" ]]
          do
            while IFS=$'\t' read -r run_id run_number
            do
              [[ "${run_id}" != "${GITHUB_RUN_ID}" ]] || continue
              archive="${BUILD_ARCHIVE_DIR}/${run_number}.tar.zst"
              sidecar="${BUILD_ARCHIVE_DIR}/${run_number}.build-sidecar.json"
              [[ -s "${archive}" && -s "${sidecar}" ]] || continue
              expected_size="$(jq -er '.build_archive.size_bytes' "${sidecar}")" || continue
              expected_sha="$(jq -er '.build_archive.sha256' "${sidecar}")" || continue
              [[ "$(stat -c '%s' "${archive}")" == "${expected_size}" ]] || continue
              [[ "$(sha256sum "${archive}" | awk '{print $1}')" == "${expected_sha}" ]] || continue
              archive_step_count="$(gh run view "${run_id}" --json jobs --jq '[.jobs[].steps[] | select((.name == "Archive OpenFOAM build" or .name == "Build and publish OpenFOAM" or .name == "Hardlink the selected archive") and .conclusion == "success")] | length')"
              [[ "${archive_step_count}" -gt 0 ]] || continue
              echo "Selected ${BUILD_ARCHIVE_DIR}/${run_number}.tar.zst"
              echo "action=reuse" >> "${GITHUB_OUTPUT}"
              echo "source_run_number=${run_number}" >> "${GITHUB_OUTPUT}"
              exit 0
            done < <(gh run list --workflow genkai.yml --commit "${commit}" --limit 20 --json databaseId,number --jq '.[] | [.databaseId, .number] | @tsv')
            commit="$(git rev-parse "${commit}^" 2>/dev/null || true)"
          done

          echo "No reusable OpenFOAM build archive was found; falling back to a new build"
          echo "action=build" >> "${GITHUB_OUTPUT}"

  reuse-build:
    name: Reuse OpenFOAM build
    needs: select-build
    if: needs.select-build.outputs.action == 'reuse'
    runs-on: [self-hosted, genkai]

    steps:
      - name: Hardlink the selected archive
        run: |
          source_number=${{ needs.select-build.outputs.source_run_number }}
          ln -f -- "${BUILD_ARCHIVE_DIR}/${source_number}.tar.zst" \
            "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.tar.zst"
          ln -f -- "${BUILD_ARCHIVE_DIR}/${source_number}.build-sidecar.json" \
            "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.build-sidecar.json"

  build-openfoam:
    name: Build OpenFOAM
    needs: select-build
    if: needs.select-build.outputs.action == 'build'
    runs-on: [self-hosted, genkai]

    concurrency:
      group: genkai-openfoam-build
      queue: max

    env:
      BUILD_DIR: /dev/shm/openfoam-build/run-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_ARCHIVE_CACHE_DIR: /home/pj26000080/share/openfoam-build/source-cache

    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v7

      - name: Build and publish OpenFOAM
        run: |
          if [[ '${{ github.event_name == 'workflow_dispatch' && inputs.reshare_ccache }}' == true ]]; then
            export CCACHE_RESHARE=true
          fi
          "${GITHUB_WORKSPACE}/scripts/build-openfoam.sh"

      - name: Upload OpenFOAM build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_DIR }}/logs
          if-no-files-found: warn
          compression-level: 1

      - name: Cleanup OpenFOAM build directory
        if: always()
        run: |
          : "${BUILD_DIR:?}"
          [[ -d "${BUILD_DIR}" ]] || exit 0
          rm -rf -- "${BUILD_DIR:?}"

  provision:
    name: Provision OpenFOAM runtime
    needs: [select-build, reuse-build, build-openfoam]
    if: >-
      always() &&
      needs.select-build.result == 'success' &&
      ((needs.select-build.outputs.action == 'reuse' && needs.reuse-build.result == 'success') ||
       (needs.select-build.outputs.action == 'build' && needs.build-openfoam.result == 'success'))
    runs-on: [self-hosted, genkai]

    outputs:
      provision_dir: ${{ steps.provision_runtime.outputs.provision_dir }}

    env:
      OPENFOAM_RUNTIME_ROOT: /fast/pj26000080/openfoam-provisioning

    steps:
      - name: Checkout runtime files
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Provision OpenFOAM runtime
        id: provision_runtime
        run: |
          install -d -m 2775 "${OPENFOAM_RUNTIME_ROOT}"
          provision_dir="$(mktemp -d "${OPENFOAM_RUNTIME_ROOT}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          echo "provision_dir=${provision_dir}" >> "${GITHUB_OUTPUT}"
          mkdir -p "${provision_dir}/control" "${provision_dir}/scripts" "${provision_dir}/logs" "${provision_dir}/results" "${provision_dir}/task"
          archive="${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.tar.zst"
          sidecar="${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.build-sidecar.json"
          expected_size="$(jq -er '.build_archive.size_bytes' "${sidecar}")"
          expected_sha="$(jq -er '.build_archive.sha256' "${sidecar}")"
          test "$(stat -c '%s' "${archive}")" = "${expected_size}"
          test "$(sha256sum "${archive}" | awk '{print $1}')" = "${expected_sha}"
          install -m 0644 "${sidecar}" "${provision_dir}/control/build-sidecar.json"
          install -m 0755 "${GITHUB_WORKSPACE}/scripts/run-openfoam.pjm" \
            "${GITHUB_WORKSPACE}/scripts/prepare-openfoam-case.pjm" \
            "${GITHUB_WORKSPACE}/scripts/prepare-openfoam-case.sh" \
            "${GITHUB_WORKSPACE}/scripts/exec-profiler.sh" \
            "${GITHUB_WORKSPACE}/scripts/allow-vtune-attach.py" \
            "${GITHUB_WORKSPACE}/scripts/export-vtune-hotspots.sh" \
            "${GITHUB_WORKSPACE}/scripts/export-vtune-perfetto.sh" \
            "${GITHUB_WORKSPACE}/scripts/vtune-hotspots-summary.py" \
            "${GITHUB_WORKSPACE}/scripts/vtune-to-perfetto.py" \
            "${GITHUB_WORKSPACE}/scripts/openfoam-rank-wrapper.py" \
            "${provision_dir}/scripts/"
          install -m 0755 "${GITHUB_WORKSPACE}/benchmark/parse_result.sh" "${provision_dir}/task/"
          cp -a "${GITHUB_WORKSPACE}/benchmark/cavity3D-64M" "${provision_dir}/task/"
          cp -a "${GITHUB_WORKSPACE}/experiment-metrics" "${provision_dir}/experiment-metrics"
          uv sync --project "${provision_dir}/experiment-metrics" --frozen --no-dev
          # Keep all installed runtime dependencies, excluding source and build trees.
          tar -I zstd -xf "${archive}" -C "${provision_dir}" \
            --exclude='*.o' \
            --exclude='*.C' \
            --exclude='*.H' \
            --exclude='*.c' \
            --exclude='*.h' \
            --exclude='./OpenFOAM/src' \
            --exclude='./OpenFOAM/applications' \
            --exclude='./OpenFOAM/wmake' \
            --exclude='./ThirdParty/build' \
            --exclude='./ThirdParty/sources' \
            --exclude='*.cmake' \
            --exclude='CMakeFiles' \
            --exclude='CMakeCache.txt' \
            --exclude='compile_commands.json' \
            --exclude='install_manifest.txt' \
            --exclude='Makefile'
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/icoFoam"
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/checkMesh"
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/mesh-facts"
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/partition-audit"
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/capture-hardware"

      - name: Cleanup failed OpenFOAM provisioning
        if: failure() && steps.provision_runtime.outputs.provision_dir != ''
        env:
          PROVISION_DIR: ${{ steps.provision_runtime.outputs.provision_dir }}
        run: rm -rf -- "${PROVISION_DIR:?}"

  prepare-case:
    name: Prepare OpenFOAM case cache
    needs: [select-build, provision]
    if: always() && needs.provision.result == 'success'
    runs-on: [self-hosted, genkai]

    concurrency:
      group: genkai-openfoam-case-${{ needs.select-build.outputs.prepare_script_sha256 }}
      queue: max

    env:
      PROVISION_DIR: ${{ needs.provision.outputs.provision_dir }}

    steps:
      - name: Run blockMesh and decomposePar when uncached
        run: |
          expected_sha='${{ needs.select-build.outputs.prepare_script_sha256 }}'
          actual_sha="$(sha256sum "${PROVISION_DIR}/scripts/prepare-openfoam-case.sh" | awk '{print $1}')"
          test "${actual_sha}" = "${expected_sha}"
          prepare_root="/fast/pj26000080/openfoam-case-prepare/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${prepare_root}"
          prepare_target="${prepare_root}/case"
          cleanup() {
            original_status=$?
            if [[ -n "${job_id:-}" ]]; then
              pjdel "${job_id}" 2>/dev/null || true
              pjwait -z "${job_id}" 2>/dev/null || true
            fi
            rm -rf -- "${prepare_root}"
            if [[ "${original_status}" -ne 0 ]]; then
              rm -rf -- "${PROVISION_DIR:?}"
            fi
          }
          trap cleanup EXIT
          submission="$(pjsub -L rscgrp=a-batch -L node=1 --mpi proc=1 \
            -x "PREPARE_TARGET=${prepare_target},PROVISION_DIR=${PROVISION_DIR}" \
            -o "${prepare_root}/%j.pjm.log" -j -N openfoam_prepare \
            "${PROVISION_DIR}/scripts/prepare-openfoam-case.pjm")"
          printf '%s\n' "${submission}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<< "${submission}")"
          test -n "${job_id}"
          pjwait -z "${job_id}"
          pjwait "${job_id}"
          cat "${prepare_root}/${job_id}.pjm.log"
          test -f "${HOME}/../share/openfoam-case-cache/${expected_sha}/READY"

  run:
    name: Run OpenFOAM
    needs: [provision, prepare-case]
    if: >-
      always() &&
      needs.provision.result == 'success' &&
      needs.prepare-case.result == 'success'
    runs-on: [self-hosted, genkai]

    env:
      OPENFOAM_RUN_ROOT: /fast/pj26000080/openfoam-runs
      PROVISION_DIR: ${{ needs.provision.outputs.provision_dir }}
      OPENFOAM_PROFILE_MODE: ${{ inputs.profile_mode || 'direct' }}
      OPENFOAM_NODE_COUNT: ${{ inputs.nodes || '1' }}

    steps:
      - name: Checkout control-plane identity
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create v2 run manifest before submission
        id: v2_context
        env:
          METRICS_CREDENTIAL_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
        run: |
          install -d -m 2775 "${OPENFOAM_RUN_ROOT}"
          test -n "${METRICS_CREDENTIAL_JSON}"
          staging_credential="${OPENFOAM_RUN_ROOT}/.bigquery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          install -m 0600 /dev/null "${staging_credential}"
          printf '%s' "${METRICS_CREDENTIAL_JSON}" >"${staging_credential}"
          trap 'rm -f -- "${staging_credential}"' EXIT
          export EXPERIMENT_METRICS_DIRECT_SEND=1
          export EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE="${staging_credential}"
          export EXPERIMENT_METRICS_BIGQUERY_CONFIG="${PROVISION_DIR}/experiment-metrics/pyproject.toml"
          uv sync --project "${PROVISION_DIR}/experiment-metrics" --frozen --no-dev --extra publish
          case "${OPENFOAM_NODE_COUNT}" in
            1) protocol_relative=experiment-metrics/registry/openfoam-v2-protocol.toml ;;
            2|4) protocol_relative="experiment-metrics/registry/openfoam-v2-protocol-${OPENFOAM_NODE_COUNT}n.toml" ;;
            *) echo "unsupported node count: ${OPENFOAM_NODE_COUNT}" >&2; exit 2 ;;
          esac
          protocol_path="${PROVISION_DIR}/${protocol_relative}"
          test -f "${protocol_path}"
          head_commit="$(git rev-parse HEAD)"
          base_commit="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || printf '%s' "${head_commit}")"
          purpose=bench
          if [[ "${OPENFOAM_PROFILE_MODE}" != direct ]]; then
            purpose=profile
            bundle_path="${GITHUB_WORKSPACE}/experiment-metrics/bundles/openfoam-profile-v1.json"
          else
            bundle_path="${GITHUB_WORKSPACE}/experiment-metrics/bundles/openfoam-score-v1.json"
          fi
          bundle_sha256="$(
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
              bundle-identity --bundle "${bundle_path}" --purpose "${purpose}"
          )"
          identities="$(
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
              source-track-identities \
              --repository "${GITHUB_WORKSPACE}" \
              --purpose "${purpose}" \
              --base-commit "${base_commit}" \
              --instrumentation-bundle-sha256 "${bundle_sha256}" \
              --control-plane-file .github/workflows/genkai.yml \
              --control-plane-file benchmark/parse_result.sh \
              --control-plane-file "${protocol_relative}" \
              --control-plane-file experiment-metrics/registry/openfoam-v2.toml \
              --control-plane-file scripts/allow-vtune-attach.py \
              --control-plane-file scripts/exec-profiler.sh \
              --control-plane-file scripts/export-vtune-hotspots.sh \
              --control-plane-file scripts/export-vtune-perfetto.sh \
              --control-plane-file scripts/prepare-openfoam-case.pjm \
              --control-plane-file scripts/prepare-openfoam-case.sh \
              --control-plane-file scripts/run-openfoam.pjm \
              --control-plane-file scripts/vtune-hotspots-summary.py \
              --control-plane-file scripts/vtune-to-perfetto.py
          )"
          manifest="$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
            init-run --runtime-root "${OPENFOAM_RUN_ROOT}" --purpose "${purpose}" \
            --identities-json "${identities}" --repository-id apac2026-openfoam \
            --instrumentation-bundle "${bundle_path}" \
            --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml")"
          run_dir="$(dirname "$(dirname "${manifest}")")"
          run_id="$(basename "${run_dir}")"
          credential_file="${run_dir}/control/bigquery-credential.json"
          mv -- "${staging_credential}" "${credential_file}"
          trap - EXIT
          trap 'rm -f -- "${credential_file}"' EXIT
          export EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE="${credential_file}"
          install -m 0644 "${PROVISION_DIR}/control/build-sidecar.json" \
            "${run_dir}/control/build-sidecar.json"
          cp -a "${PROVISION_DIR}/control/build-raw" "${run_dir}/control/build-raw"
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
            record-artifact-index --manifest "${manifest}" --runtime-dir "${run_dir}" \
            --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
            --build-sidecar "${run_dir}/control/build-sidecar.json"
          printf 'run_id=%s\nmanifest=%s\nrun_dir=%s\n' \
            "${run_id}" "${manifest}" "${run_dir}" >> "${GITHUB_OUTPUT}"
          printf 'RUN_ID=%s\nRUN_MANIFEST=%s\nRUN_DIR=%s\n' \
            "${run_id}" "${manifest}" "${run_dir}" >> "${GITHUB_ENV}"
          printf 'EXPERIMENT_METRICS_DIRECT_SEND=1\n' >>"${GITHUB_ENV}"
          printf 'EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE=%s\n' "${credential_file}" >>"${GITHUB_ENV}"
          printf 'EXPERIMENT_METRICS_BIGQUERY_CONFIG=%s\n' \
            "${PROVISION_DIR}/experiment-metrics/pyproject.toml" >>"${GITHUB_ENV}"
          printf 'OPENFOAM_PROTOCOL_PATH=%s\n' "${protocol_path}" >>"${GITHUB_ENV}"
          trap - EXIT

      - name: Verify runner BigQuery connectivity
        run: |
          uv sync --project "${PROVISION_DIR}/experiment-metrics" --frozen --no-dev --extra publish
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
            smoke-send --run "${RUN_ID}" --source runner

      - name: Submit OpenFOAM job
        run: |
          job_id="$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
            submit-run --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" \
            --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
            --protocol "${OPENFOAM_PROTOCOL_PATH}" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --pjm-script-repository-path scripts/run-openfoam.pjm \
            --execution-script "${PROVISION_DIR}/scripts/run-openfoam.pjm" \
            --provision-dir "${PROVISION_DIR}" --profile-mode "${OPENFOAM_PROFILE_MODE}")"
          test -n "${job_id}"
          echo "PJM_JOB_ID=${job_id}" >> "${GITHUB_ENV}"

      - name: Wait for OpenFOAM job to start
        run: |
          while [[ ! -e "${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log" ]]; do
            wait_status="$(pjwait -w waitnone "${PJM_JOB_ID}")"
            pjm_code="$(awk 'NR == 1 { print $2 }' <<< "${wait_status}")"
            if [[ -n "${pjm_code}" && "${pjm_code}" != X ]]; then
              printf '%s\n' "${wait_status}"
              echo "PJM job ended before creating ${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log" >&2
              exit 1
            fi
            sleep 2
          done
          echo "PJM job log is ready: ${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log"

      - name: Stream OpenFOAM execution log
        run: |
          # The PJM record is durable inside RUN_DIR; follow it only for
          # scheduler diagnostics while solver stdout/stderr remains combined.
          tail --lines=+1 --follow=name "${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log" &
          stream_pid=$!
          stop_stream() {
            kill "${stream_pid}" 2>/dev/null || true
            wait "${stream_pid}" 2>/dev/null || true
          }
          trap stop_stream EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          pjwait -z "${PJM_JOB_ID}"
          sleep 1

      - name: Verify OpenFOAM job completion
        run: |
          pjwait "${PJM_JOB_ID}"
          if [[ ! -e "${RUN_DIR}/run-success" ]]; then
            echo 'OpenFOAM job did not create run-success' >&2
            for log in \
              "${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log" \
              "${RUN_DIR}/logs/solver.log"; do
              if [[ -f "${log}" ]]; then
                echo "===== ${log} =====" >&2
                tail -n 240 "${log}" >&2
              fi
            done
            exit 1
          fi

      - name: Publish VTune hotspots to Actions summary
        if: success() && inputs.profile_mode == 'vtune-hotspots'
        run: |
          summary="${RUN_DIR}/profile/raw/vtune-summary/summary.md"
          test -s "${summary}"
          cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          vtune_result_dir="$(sed -n 's/^vtune_result_dir=//p' \
            "${RUN_DIR}/logs/profile-location.txt")"
          test -n "${vtune_result_dir}"
          {
            printf '\nVTune result on Genkai:\n\n'
            printf -- '- `%s`\n' "${vtune_result_dir}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Generate rich VTune Perfetto JSON
        if: success() && inputs.profile_mode == 'vtune-hotspots'
        run: |
          vtune_result_dir="$(sed -n 's/^vtune_result_dir=//p' \
            "${RUN_DIR}/logs/profile-location.txt")"
          test -n "${vtune_result_dir}"
          VTUNE_RESULT_DIR="${vtune_result_dir}" \
          RUN_LABEL="${RUN_ID}" \
          PROVISION_DIR="${PROVISION_DIR}" \
          RUN_DIR="${RUN_DIR}" \
            "${PROVISION_DIR}/scripts/export-vtune-perfetto.sh"

      - name: Upload rich VTune Perfetto artifact
        id: upload_vtune_perfetto
        if: success() && inputs.profile_mode == 'vtune-hotspots'
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-vtune-perfetto-${{ steps.v2_context.outputs.run_id }}
          path: |
            ${{ steps.v2_context.outputs.run_dir }}/profile/raw/vtune-perfetto/openfoam-vtune-perfetto.json
            ${{ steps.v2_context.outputs.run_dir }}/profile/raw/vtune-perfetto/summary.json
            ${{ steps.v2_context.outputs.run_dir }}/profile/raw/vtune-perfetto/timeline.csv
            ${{ steps.v2_context.outputs.run_dir }}/profile/raw/vtune-perfetto/hotspots.csv
          if-no-files-found: error
          compression-level: 6

      - name: Add Perfetto artifact to Actions summary
        if: success() && inputs.profile_mode == 'vtune-hotspots'
        env:
          PERFETTO_ARTIFACT_URL: ${{ steps.upload_vtune_perfetto.outputs.artifact-url }}
        run: |
          {
            printf '\n## Perfetto trace\n\n'
            printf '[Download the rich VTune Perfetto artifact](%s), extract ' \
              "${PERFETTO_ARTIFACT_URL}"
            printf '`openfoam-vtune-perfetto.json`, and open it in '
            printf '[Perfetto](https://ui.perfetto.dev/).\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record v2 terminal sources
        if: always()
        run: |
          record_status=0
          if [[ -n "${PJM_JOB_ID:-}" && \
                -f "${RUN_DIR}/control/submission-result.json" && \
                -f "${RUN_DIR}/control/job-entry.json" ]]; then
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
              record-scheduler-terminal --manifest "${RUN_MANIFEST}" \
              --runtime-dir "${RUN_DIR}" \
              --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
              --job-id "${PJM_JOB_ID}" || record_status=1
          else
            echo 'scheduler identity sources are absent; collection will be incomplete' >&2
          fi
          if [[ -s "${RUN_DIR}/logs/solver.log" ]]; then
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
              record-solver-log --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" \
              --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
              --log "${RUN_DIR}/logs/solver.log" || record_status=1
          else
            echo 'solver log is absent; collection will be incomplete' >&2
          fi
          if [[ -d "${RUN_DIR}/domain/pstream" ]] && \
             compgen -G "${RUN_DIR}/domain/pstream/rank-*.jsonl" > /dev/null; then
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
              record-pstream --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" \
              --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
              --protocol "${OPENFOAM_PROTOCOL_PATH}" \
              --source-dir "${RUN_DIR}/domain/pstream" || record_status=1
          else
            echo 'Pstream rank JSONL is absent; collection will be incomplete' >&2
          fi
          if [[ -f "${RUN_DIR}/source/env/host-exec.snapshot" && \
                -d "${RUN_DIR}/source/placement" && \
                -f "${RUN_DIR}/control/scheduler-accounting.json" && \
                -f "${RUN_DIR}/logs/solver.log" ]]; then
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
              record-execution-context --manifest "${RUN_MANIFEST}" \
              --runtime-dir "${RUN_DIR}" \
              --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
              --protocol "${OPENFOAM_PROTOCOL_PATH}" \
              --host-snapshot "${RUN_DIR}/source/env/host-exec.snapshot" \
              --placement-root "${RUN_DIR}/source/placement" \
              --scheduler-request "${RUN_DIR}/control/scheduler-request.json" \
              --scheduler-accounting "${RUN_DIR}/control/scheduler-accounting.json" \
              --decompose-dict "${RUN_DIR}/source/mesh/decomposeParDict" \
              --solver-log "${RUN_DIR}/logs/solver.log" || record_status=1
          else
            echo 'execution-context sources are absent; collection will be incomplete' >&2
          fi
          if [[ "${OPENFOAM_PROFILE_MODE}" == perf-stat ]]; then
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
              record-profile-perf --manifest "${RUN_MANIFEST}" \
              --runtime-dir "${RUN_DIR}" \
              --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
              --protocol "${OPENFOAM_PROTOCOL_PATH}" \
              || record_status=1
          fi
          if [[ "${record_status}" -ne 0 ]]; then
            echo 'one or more metric producers failed; workload result is unchanged' >&2
          fi

      - name: Package fixed v2 artifact set
        id: package_v2
        if: always()
        run: |
          args=(package --manifest "${RUN_MANIFEST}")
          for pair in \
            'control/run-manifest.json:run_manifest' \
            'control/instrumentation-bundle.json:instrumentation_bundle' \
            'control/build-sidecar.json:build_sidecar' \
            'control/build-provision-validation.json:build_provision_validation' \
            'control/job-entry.json:job_entry' \
            'control/scheduler-accounting.json:scheduler_accounting' \
            'control/scheduler-request.json:scheduler_request' \
            'control/scheduler-terminal.json:scheduler_terminal' \
            'control/submission-result.json:scheduler_submission_result' \
            'logs/blockMesh.log:block_mesh_log' \
            'logs/decomposePar.log:decompose_par_log' \
            'logs/solver.log:solver_log' \
            "logs/${PJM_JOB_ID}.pjm.log:pjm_log" \
            'results/result.txt:official_result' \
            'source/env/host-exec.snapshot:host_exec_environment' \
            'source/env/job-entry.snapshot:job_entry_environment' \
            'source/network/imb-mpi1/argv.json:imb_mpi1_argv' \
            'source/network/imb-mpi1/stderr.txt:imb_mpi1_stderr' \
            'source/network/imb-mpi1/stdout.txt:imb_mpi1_stdout' \
            'source/scheduler/accounting.stderr:scheduler_accounting_stderr' \
            'source/scheduler/accounting.stdout:scheduler_accounting_stdout' \
            'source/scheduler/submission.stderr:scheduler_submission_stderr' \
            'source/scheduler/submission.stdout:scheduler_submission_stdout'
          do
            relative="${pair%%:*}"
            if [[ -f "${RUN_DIR}/${relative}" ]]; then
              args+=(--member "${pair}")
            fi
          done
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:rank_placement")
          done < <(find "${RUN_DIR}/source/placement" -type f -name 'rank-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:pstream_source")
          done < <(find "${RUN_DIR}/domain/pstream" -type f -print0 | sort -z)
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:minimal_hardware")
          done < <(find "${RUN_DIR}/source/hardware" -type f \
            -name 'node-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:postrun_source")
          done < <(find "${RUN_DIR}/source/hardware" -type f \
            ! -name 'node-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:postrun_source")
          done < <(find "${RUN_DIR}/source/mesh" \
            "${RUN_DIR}/source/build-provision" \
            -type f -print0 | sort -z)
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:build_raw")
          done < <(find "${RUN_DIR}/control/build-raw" -type f -print0 | sort -z)
          if [[ -f "${RUN_DIR}/source/workload-manifest.json" ]]; then
            args+=(--member 'source/workload-manifest.json:workload_manifest')
          fi
          if [[ -d "${RUN_DIR}/source/workload" ]]; then
            while IFS= read -r -d '' path; do
              args+=(--member "${path#"${RUN_DIR}/"}:workload_member")
            done < <(find "${RUN_DIR}/source/workload" -type f -print0 | sort -z)
          fi
          if [[ "${OPENFOAM_PROFILE_MODE}" != direct ]]; then
            while IFS= read -r -d '' path; do
              args+=(--profile-member "${path#"${RUN_DIR}/"}")
            done < <(find "${RUN_DIR}/profile/raw" -type f -print0 | sort -z)
          fi
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" "${args[@]}"

      - name: Upload fixed v2 artifact set
        id: upload_v2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-v2-${{ steps.v2_context.outputs.run_id }}
          path: |
            ${{ steps.v2_context.outputs.run_dir }}/artifact-manifest.json
            ${{ steps.v2_context.outputs.run_dir }}/run-artifacts.tar.zst
            ${{ steps.v2_context.outputs.run_dir }}/profile-raw.tar.zst
          if-no-files-found: error
          compression-level: 0

      - name: Upload cavity3D result
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-cavity3d-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.v2_context.outputs.run_dir }}/results
          if-no-files-found: error
          compression-level: 0

      - name: Cleanup provisioned runtime
        if: always()
        run: |
          if [[ -n "${EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE:-}" ]]; then
            rm -f -- "${EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE}"
          fi
          if [[ -n "${PJM_JOB_ID:-}" ]]; then
            pjdel "${PJM_JOB_ID}" 2>/dev/null || true
            pjwait -z "${PJM_JOB_ID}" || true
          fi
          rm -rf -- "${PROVISION_DIR:?}"

  archive-artifacts:
    name: Archive artifacts on home server
    needs: run
    if: always()
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Connect to home server through Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:apac-hpc-ai-actions
          ping: tomokazu-ubuntu-server

      - name: Configure SSH
        env:
          ARTIFACT_SERVER_SSH_PRIVATE_KEY: ${{ secrets.ARTIFACT_SERVER_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${ARTIFACT_SERVER_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 0600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan -H tomokazu-ubuntu-server >> "${HOME}/.ssh/known_hosts"

      - name: Copy artifacts to home server
        run: |
          ssh tomokazu@tomokazu-ubuntu-server "mkdir -p -- /hdd_raid/samba/net_share/openfoam-artifacts/${GITHUB_RUN_ID}"
          scp -r artifacts/. "tomokazu@tomokazu-ubuntu-server:/hdd_raid/samba/net_share/openfoam-artifacts/${GITHUB_RUN_ID}/"

      - name: Delete copied GitHub artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r artifact_id
          do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

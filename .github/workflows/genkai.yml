name: OpenFOAM on genkai

on:
  workflow_dispatch:
  push:

jobs:
  openfoam:
    name: Build OpenFOAM with Intel oneAPI
    runs-on: [self-hosted, genkai]
    # 共有ソースアーカイブキャッシュへの同時書き込みを防ぐ。
    concurrency:
      group: genkai-openfoam-build
      cancel-in-progress: false

    env:
      # ビルド対象のバージョンと並列数
      OPENFOAM_VERSION: v2412
      ADIOS2_VERSION: 2.12.1
      CGAL_VERSION: 6.1.1
      INTEL_ONEAPI_MODULE_VERSION: 2025.1.3
      OPENFOAM_BUILD_PARALLELISM: 120

      # 永続化するソースアーカイブ
      SOURCE_ARCHIVE_CACHE_DIR: /home/pj26000080/share/openfoam-build/source-cache

      # OpenFOAMのwmakeとThirdPartyのCMakeビルドで使うコンパイラ設定
      CC: mpiicx
      CXX: mpiicpx
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download source archives
        run: |
          mkdir -p "${SOURCE_ARCHIVE_CACHE_DIR}"
          for archive_url in \
            "https://dl.openfoam.com/source/${OPENFOAM_VERSION}/OpenFOAM-${OPENFOAM_VERSION}.tgz" \
            "https://dl.openfoam.com/source/${OPENFOAM_VERSION}/ThirdParty-${OPENFOAM_VERSION}.tgz" \
            "https://github.com/ornladios/ADIOS2/archive/refs/tags/v${ADIOS2_VERSION}.tar.gz" \
            "https://github.com/CGAL/cgal/releases/download/v${CGAL_VERSION}/CGAL-${CGAL_VERSION}.tar.xz"
          do
            wget --no-verbose --no-clobber --directory-prefix="${SOURCE_ARCHIVE_CACHE_DIR}" "${archive_url}"
          done

      - name: Prepare /dev/shm build directory
        id: prepare_build_directory
        run: |
          openfoam_build_tmpdir="$(mktemp -d "/dev/shm/openfoam-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          # サーバー側のキャッシュを使い、ビルドパスの正規化と一時ファイルのtmpfs配置だけを指定する。
          {
            echo "OPENFOAM_BUILD_TMPDIR=${openfoam_build_tmpdir}"
            echo "CCACHE_BASEDIR=${openfoam_build_tmpdir}"
            echo "CCACHE_TEMPDIR=${openfoam_build_tmpdir}/.ccache-tmp"
          } >> "${GITHUB_ENV}"
          mkdir -p "${openfoam_build_tmpdir}/.ccache-tmp"

      - name: Extract and patch sources
        run: |
          for source_package in OpenFOAM ThirdParty
          do
            tar -xzf "${SOURCE_ARCHIVE_CACHE_DIR}/${source_package}-${OPENFOAM_VERSION}.tgz" -C "${OPENFOAM_BUILD_TMPDIR}"
          done
          thirdparty_source_dir="${OPENFOAM_BUILD_TMPDIR}/ThirdParty-${OPENFOAM_VERSION}"
          mkdir -p "${thirdparty_source_dir}/sources/adios" "${thirdparty_source_dir}/sources/cgal"
          tar -xzf "${SOURCE_ARCHIVE_CACHE_DIR}/v${ADIOS2_VERSION}.tar.gz" \
            -C "${thirdparty_source_dir}/sources/adios"
          tar -xJf "${SOURCE_ARCHIVE_CACHE_DIR}/CGAL-${CGAL_VERSION}.tar.xz" \
            -C "${thirdparty_source_dir}/sources/cgal"
          # patchesディレクトリ内の全パッチをビルド構成として適用する。
          for patch_file in "${GITHUB_WORKSPACE}"/patches/*.patch
          do
            patch -d "${OPENFOAM_BUILD_TMPDIR}" -p0 < "${patch_file}"
          done

      - name: Build OpenFOAM
        run: |
          module purge
          module load "intel/${INTEL_ONEAPI_MODULE_VERSION}" impi
          for build_tool in "${CC}" "${CXX}" ccache perf
          do
            "${build_tool}" --version
          done
          command -v pidstat
          ccache --show-config
          openfoam_source_dir="${OPENFOAM_BUILD_TMPDIR}/OpenFOAM-${OPENFOAM_VERSION}"
          # OpenFOAMのbashrcは未定義変数や途中コマンドの終了値を許容するため、読み込み中だけ厳格モードを外す。
          set +eu
          source "${openfoam_source_dir}/etc/bashrc" \
            WM_COMPILER=Icx \
            WM_MPLIB=INTELMPI \
            WM_LABEL_SIZE=64 \
            WM_PRECISION_OPTION=DP \
            WM_COMPILE_CONTROL=+ccache
          set -eu
          # OpenFOAMのリンク時にThirdPartyのFFTWライブラリを参照可能にする。
          export LD_LIBRARY_PATH="${FFTW_ARCH_PATH}/lib:${LD_LIBRARY_PATH:-}"
          export FOAM_EXTRA_LDFLAGS="-Wl,-rpath-link,${FFTW_ARCH_PATH}/lib"
          cd "${WM_PROJECT_DIR}"
          # -log内部のteeでもwmakeの終了コードを保持し、標準出力は破棄する。
          build_status=0
          perf stat -d -I 5000 -o "${OPENFOAM_BUILD_TMPDIR}/perf-stat.log" -- \
            perf record -F 1 -g --call-graph fp -e task-clock \
              -o "${OPENFOAM_BUILD_TMPDIR}/perf.data" -- \
            /usr/bin/time -v -o "${OPENFOAM_BUILD_TMPDIR}/resource-usage.log" \
              bash -o pipefail ./Allwmake -j "${OPENFOAM_BUILD_PARALLELISM}" -s \
              -log="${OPENFOAM_BUILD_TMPDIR}/allwmake.log" > /dev/null &
          build_pid=$!
          pidstat -druw -h -p "${build_pid}" -T ALL 5 \
            > "${OPENFOAM_BUILD_TMPDIR}/pidstat.log" &
          pidstat_pid=$!
          wait "${build_pid}" || build_status=$?
          kill "${pidstat_pid}" 2>/dev/null || true
          wait "${pidstat_pid}" 2>/dev/null || true
          if [[ -s "${OPENFOAM_BUILD_TMPDIR}/perf.data" ]]; then
            perf report --stdio --sort comm,dso,symbol --percent-limit 0.1 \
              -i "${OPENFOAM_BUILD_TMPDIR}/perf.data" \
              > "${OPENFOAM_BUILD_TMPDIR}/perf-report.txt"
          fi
          if (( build_status != 0 )); then
            grep -Eai -m 200 \
              '(^|[[:space:]])(fatal[[:space:]]+)?error([[:space:](]|:)|undefined reference|collect2:|make(\[[0-9]+\])?: \*\*\*|wmake error' \
              "${OPENFOAM_BUILD_TMPDIR}/allwmake.log" >&2 || true
            exit "${build_status}"
          fi
          ccache --show-stats

      - name: Upload OpenFOAM build log
        if: always() && steps.prepare_build_directory.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OPENFOAM_BUILD_TMPDIR }}/allwmake.log
            ${{ env.OPENFOAM_BUILD_TMPDIR }}/perf-stat.log
            ${{ env.OPENFOAM_BUILD_TMPDIR }}/perf-report.txt
            ${{ env.OPENFOAM_BUILD_TMPDIR }}/perf.data
            ${{ env.OPENFOAM_BUILD_TMPDIR }}/pidstat.log
            ${{ env.OPENFOAM_BUILD_TMPDIR }}/resource-usage.log
          if-no-files-found: warn
          compression-level: 1

      - name: Cleanup /dev/shm build directory
        if: always()
        run: |
          # この実行で作成したmktempディレクトリ以外は削除しない。
          if [[ "${OPENFOAM_BUILD_TMPDIR:-}" == /dev/shm/openfoam-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.* ]]; then
            rm -rf -- "${OPENFOAM_BUILD_TMPDIR}"
          fi

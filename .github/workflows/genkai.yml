name: OpenFOAM on genkai

on:
  workflow_dispatch:
    inputs:
      require_build:
        description: Build from source instead of reusing the nearest build archive from the first-parent history
        required: true
        default: false
        type: boolean
      reshare_ccache:
        description: Build from source and republish local ccache hits to remote storage
        required: true
        default: false
        type: boolean
      profile_mode:
        description: Run directly for scoring or opt in to perf stat profiling
        required: true
        default: direct
        type: choice
        options:
          - direct
          - perf-stat
  push:
    paths-ignore:
      - 'research/**'
      - '**/.md'

permissions:
  actions: read
  contents: read

env:
  BUILD_ARCHIVE_DIR: /home/pj26000080/share/openfoam-build/builds
  GIT_MIRROR_DIR: /fast/pj26000080/git-mirror

defaults:
  run:
    shell: bash --login -eo pipefail {0}

jobs:
  select-build:
    name: Select OpenFOAM build
    runs-on: [self-hosted, genkai]

    outputs:
      action: ${{ steps.select.outputs.action }}
      source_run_number: ${{ steps.select.outputs.source_run_number }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select an existing archive or a new build
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ '${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[require-build]')) || (github.event_name == 'workflow_dispatch' && (inputs.require_build || inputs.reshare_ccache)) }}' == true ]]; then
            echo "A new OpenFOAM build was explicitly requested"
            echo "action=build" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          commit="${GITHUB_SHA}"
          while [[ -n "${commit}" ]]
          do
            while IFS=$'\t' read -r run_id run_number
            do
              [[ "${run_id}" != "${GITHUB_RUN_ID}" ]] || continue
              [[ -s "${BUILD_ARCHIVE_DIR}/${run_number}.tar.zst" ]] || continue
              archive_step_count="$(gh run view "${run_id}" --json jobs --jq '[.jobs[].steps[] | select((.name == "Archive OpenFOAM build" or .name == "Build and publish OpenFOAM" or .name == "Hardlink the selected archive") and .conclusion == "success")] | length')"
              [[ "${archive_step_count}" -gt 0 ]] || continue
              echo "Selected ${BUILD_ARCHIVE_DIR}/${run_number}.tar.zst"
              echo "action=reuse" >> "${GITHUB_OUTPUT}"
              echo "source_run_number=${run_number}" >> "${GITHUB_OUTPUT}"
              exit 0
            done < <(gh run list --workflow genkai.yml --commit "${commit}" --limit 20 --json databaseId,number --jq '.[] | [.databaseId, .number] | @tsv')
            commit="$(git rev-parse "${commit}^" 2>/dev/null || true)"
          done

          echo "No reusable OpenFOAM build archive was found; falling back to a new build"
          echo "action=build" >> "${GITHUB_OUTPUT}"

  reuse-build:
    name: Reuse OpenFOAM build
    needs: select-build
    if: needs.select-build.outputs.action == 'reuse'
    runs-on: [self-hosted, genkai]

    steps:
      - name: Hardlink the selected archive
        run: ln -f -- "${BUILD_ARCHIVE_DIR}/${{ needs.select-build.outputs.source_run_number }}.tar.zst" "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.tar.zst"

  build-openfoam:
    name: Build OpenFOAM
    needs: select-build
    if: needs.select-build.outputs.action == 'build'
    runs-on: [self-hosted, genkai]

    concurrency:
      group: genkai-openfoam-build
      queue: single

    env:
      BUILD_DIR: /dev/shm/openfoam-build/run-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_ARCHIVE_CACHE_DIR: /home/pj26000080/share/openfoam-build/source-cache

    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v7

      - name: Build and publish OpenFOAM
        run: |
          if [[ '${{ github.event_name == 'workflow_dispatch' && inputs.reshare_ccache }}' == true ]]; then
            export CCACHE_RESHARE=true
          fi
          "${GITHUB_WORKSPACE}/scripts/build-openfoam.sh"

      - name: Upload OpenFOAM build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_DIR }}/logs
          if-no-files-found: warn
          compression-level: 1

      - name: Cleanup OpenFOAM build directory
        if: always()
        run: |
          : "${BUILD_DIR:?}"
          [[ -d "${BUILD_DIR}" ]] || exit 0
          rm -rf -- "${BUILD_DIR:?}"

  provision:
    name: Provision OpenFOAM runtime
    needs: [select-build, reuse-build, build-openfoam]
    if: >-
      always() &&
      needs.select-build.result == 'success' &&
      ((needs.select-build.outputs.action == 'reuse' && needs.reuse-build.result == 'success') ||
       (needs.select-build.outputs.action == 'build' && needs.build-openfoam.result == 'success'))
    runs-on: [self-hosted, genkai]

    outputs:
      provision_dir: ${{ steps.provision_runtime.outputs.provision_dir }}

    env:
      OPENFOAM_RUNTIME_ROOT: /fast/pj26000080/openfoam-provisioning

    steps:
      - name: Checkout runtime files
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Provision OpenFOAM runtime
        id: provision_runtime
        run: |
          install -d -m 2775 "${OPENFOAM_RUNTIME_ROOT}"
          provision_dir="$(mktemp -d "${OPENFOAM_RUNTIME_ROOT}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          echo "provision_dir=${provision_dir}" >> "${GITHUB_OUTPUT}"
          mkdir -p "${provision_dir}/scripts" "${provision_dir}/logs" "${provision_dir}/results" "${provision_dir}/task"
          install -m 0755 "${GITHUB_WORKSPACE}/scripts/run-openfoam.pjm" "${GITHUB_WORKSPACE}/scripts/exec-profiler.sh" "${provision_dir}/scripts/"
          install -m 0755 "${GITHUB_WORKSPACE}/benchmark/parse_result.sh" "${provision_dir}/task/"
          cp -a "${GITHUB_WORKSPACE}/benchmark/cavity3D-64M" "${provision_dir}/task/"
          cp -a "${GITHUB_WORKSPACE}/experiment-metrics" "${provision_dir}/experiment-metrics"
          uv sync --project "${provision_dir}/experiment-metrics" --frozen --no-dev
          # Keep all installed runtime dependencies, excluding source and build trees.
          tar -I zstd -xf "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.tar.zst" -C "${provision_dir}" \
            --exclude='*.o' \
            --exclude='*.C' \
            --exclude='*.H' \
            --exclude='*.c' \
            --exclude='*.h' \
            --exclude='./OpenFOAM/src' \
            --exclude='./OpenFOAM/applications' \
            --exclude='./OpenFOAM/wmake' \
            --exclude='./ThirdParty/build' \
            --exclude='./ThirdParty/sources' \
            --exclude='*.cmake' \
            --exclude='CMakeFiles' \
            --exclude='CMakeCache.txt' \
            --exclude='compile_commands.json' \
            --exclude='install_manifest.txt' \
            --exclude='Makefile'
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/icoFoam"
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/checkMesh"
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/mesh-facts"
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/partition-audit"

      - name: Cleanup failed OpenFOAM provisioning
        if: failure() && steps.provision_runtime.outputs.provision_dir != ''
        env:
          PROVISION_DIR: ${{ steps.provision_runtime.outputs.provision_dir }}
        run: rm -rf -- "${PROVISION_DIR:?}"

  run:
    name: Run OpenFOAM
    needs: provision
    if: always() && needs.provision.result == 'success'
    runs-on: [self-hosted, genkai]

    env:
      OPENFOAM_RUN_ROOT: /fast/pj26000080/openfoam-runs
      PROVISION_DIR: ${{ needs.provision.outputs.provision_dir }}
      OPENFOAM_PROFILE_MODE: ${{ inputs.profile_mode || 'direct' }}

    steps:
      - name: Checkout control-plane identity
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Create v2 run manifest before submission
        id: v2_context
        run: |
          install -d -m 2775 "${OPENFOAM_RUN_ROOT}"
          git_algorithm="$(git rev-parse --show-object-format)"
          head_commit="$(git rev-parse HEAD)"
          base_commit="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || printf '%s' "${head_commit}")"
          control_sha256="$(
            sha256sum \
              "${GITHUB_WORKSPACE}/.github/workflows/genkai.yml" \
              "${GITHUB_WORKSPACE}/scripts/run-openfoam.pjm" \
              "${GITHUB_WORKSPACE}/benchmark/parse_result.sh" \
              "${GITHUB_WORKSPACE}/experiment-metrics/registry/openfoam-v2.toml" |
              sha256sum | awk '{print $1}'
          )"
          bundle_sha256="$(
            find "${GITHUB_WORKSPACE}/experiment-metrics" -type f \
              -not -path '*/.venv/*' -print0 |
              sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          )"
          purpose=bench
          if [[ "${OPENFOAM_PROFILE_MODE}" == perf-stat ]]; then
            purpose=profile
            base_role=profile_base
          else
            base_role=score_reference
          fi
          identities="$(printf '{"source_track":{"object_hash_algorithm":"%s","base_role":"%s","base_commit":"%s","head_commit":"%s"},"observed_control_plane_sha256":"%s","instrumentation_bundle_sha256":"%s"}' \
            "${git_algorithm}" "${base_role}" "${base_commit}" "${head_commit}" \
            "${control_sha256}" "${bundle_sha256}")"
          manifest="$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
            init-run --runtime-root "${OPENFOAM_RUN_ROOT}" --purpose "${purpose}" \
            --identities-json "${identities}" --repository-id "${GITHUB_REPOSITORY}" \
            --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml")"
          run_dir="$(dirname "$(dirname "${manifest}")")"
          run_id="$(basename "${run_dir}")"
          printf 'run_id=%s\nmanifest=%s\nrun_dir=%s\n' \
            "${run_id}" "${manifest}" "${run_dir}" >> "${GITHUB_OUTPUT}"
          printf 'RUN_ID=%s\nRUN_MANIFEST=%s\nRUN_DIR=%s\n' \
            "${run_id}" "${manifest}" "${run_dir}" >> "${GITHUB_ENV}"

      - name: Submit OpenFOAM job
        run: |
          job_environment="RUN_ID=${RUN_ID},RUN_MANIFEST=${RUN_MANIFEST},RUN_DIR=${RUN_DIR}"
          job_output="$(pjsub -x "${job_environment}" -o "${RUN_DIR}/logs/%j.pjm.log" -j \
            -N openfoam_run "${PROVISION_DIR}/scripts/run-openfoam.pjm" \
            "${PROVISION_DIR}" "${OPENFOAM_PROFILE_MODE}")"
          printf '%s\n' "${job_output}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<< "${job_output}")"
          test -n "${job_id}"
          echo "PJM_JOB_ID=${job_id}" >> "${GITHUB_ENV}"

      - name: Wait for OpenFOAM job to start
        run: |
          while [[ ! -e "${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log" ]]; do
            wait_status="$(pjwait -w waitnone "${PJM_JOB_ID}")"
            pjm_code="$(awk 'NR == 1 { print $2 }' <<< "${wait_status}")"
            if [[ -n "${pjm_code}" && "${pjm_code}" != X ]]; then
              printf '%s\n' "${wait_status}"
              echo "PJM job ended before creating ${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log" >&2
              exit 1
            fi
            sleep 2
          done
          echo "PJM job log is ready: ${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log"

      - name: Stream OpenFOAM execution log
        run: |
          # The PJM record is durable inside RUN_DIR; follow it only for
          # scheduler diagnostics while solver stdout/stderr remains combined.
          tail --lines=+1 --follow=name "${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log" &
          stream_pid=$!
          stop_stream() {
            kill "${stream_pid}" 2>/dev/null || true
            wait "${stream_pid}" 2>/dev/null || true
          }
          trap stop_stream EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          pjwait -z "${PJM_JOB_ID}"
          sleep 1

      - name: Verify OpenFOAM job completion
        run: |
          pjwait "${PJM_JOB_ID}"
          test -e "${RUN_DIR}/run-success"

      - name: Record saved solver log
        if: always()
        run: |
          if [[ -s "${RUN_DIR}/logs/solver.log" ]]; then
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
              record-solver-log --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" \
              --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
              --log "${RUN_DIR}/logs/solver.log"
          else
            echo 'solver log is absent; collection will be incomplete' >&2
          fi

      - name: Record Pstream rank sources
        if: always()
        run: |
          if [[ -d "${RUN_DIR}/domain/pstream" ]] && \
             compgen -G "${RUN_DIR}/domain/pstream/rank-*.jsonl" > /dev/null; then
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
              record-pstream --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" \
              --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
              --protocol "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2-protocol.toml" \
              --source-dir "${RUN_DIR}/domain/pstream"
          else
            echo 'Pstream rank JSONL is absent; collection will be incomplete' >&2
          fi

      - name: Record validated post-run sources
        if: always()
        run: |
          source_root="${RUN_DIR}/source"
          if [[ -f "${source_root}/hardware/node-0.json" && \
                -f "${source_root}/mesh/topology.json" && \
                -f "${source_root}/mesh/decomposeParDict" && \
                -f "${source_root}/mesh/partition-observed.json" ]]; then
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
              record-postrun --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" \
              --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
              --hardware "${source_root}/hardware/node-0.json" \
              --hardware-source-member source/hardware/node-0.json \
              --topology "${source_root}/mesh/topology.json" \
              --decompose-dict "${source_root}/mesh/decomposeParDict" \
              --partition-observed "${source_root}/mesh/partition-observed.json"
          else
            echo 'one or more v2 post-run sources are absent; collection will be incomplete' >&2
          fi

      - name: Merge terminal fragments
        if: always()
        run: |
          set +e
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
            merge --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" \
            --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml" \
            --protocol "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2-protocol.toml"
          merge_status=$?
          set -e
          echo "MERGE_STATUS=${merge_status}" >> "${GITHUB_ENV}"
          echo "v2 merge status: ${merge_status} (1 means intentionally incomplete)"

      - name: Package fixed v2 artifact set
        id: package_v2
        if: always()
        run: |
          args=(package --manifest "${RUN_MANIFEST}")
          for pair in \
            'control/run-manifest.json:run_manifest' \
            'logs/blockMesh.log:block_mesh_log' \
            'logs/decomposePar.log:decompose_par_log' \
            'logs/solver.log:solver_log' \
            "logs/${PJM_JOB_ID}.pjm.log:pjm_log" \
            'logs/profile-location.txt:profile_location' \
            'logs/checkMesh.log:check_mesh_log' \
            'results/result.txt:official_result' \
            'source/network/imb-mpi1/stdout.txt:imb_mpi1_stdout' \
            'domain/network-imb-mpi1-results.jsonl:imb_mpi1_projection'
          do
            relative="${pair%%:*}"
            if [[ -f "${RUN_DIR}/${relative}" ]]; then
              args+=(--member "${pair}")
            fi
          done
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:pstream_source")
          done < <(find "${RUN_DIR}/domain/pstream" -type f -print0 | sort -z)
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:postrun_source")
          done < <(find "${RUN_DIR}/source/hardware" "${RUN_DIR}/source/mesh" \
            -type f -print0 | sort -z)
          if [[ "${OPENFOAM_PROFILE_MODE}" == perf-stat ]]; then
            while IFS= read -r -d '' path; do
              args+=(--profile-member "${path#"${RUN_DIR}/"}")
            done < <(find "${RUN_DIR}/profile/raw" -type f -print0 | sort -z)
          fi
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" "${args[@]}"

      - name: Upload fixed v2 artifact set
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-v2-${{ steps.v2_context.outputs.run_id }}
          path: |
            ${{ steps.v2_context.outputs.run_dir }}/artifact-manifest.json
            ${{ steps.v2_context.outputs.run_dir }}/run-artifacts.tar.zst
            ${{ steps.v2_context.outputs.run_dir }}/metrics.jsonl
            ${{ steps.v2_context.outputs.run_dir }}/profile-raw.tar.zst
          if-no-files-found: error
          compression-level: 0

      - name: Publish v2 raw facts to BigQuery
        if: always() && steps.package_v2.outcome == 'success'
        env:
          EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
        run: |
          test -n "${EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON}"
          uv sync --project "${PROVISION_DIR}/experiment-metrics" \
            --frozen --no-dev --extra publish
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
            publish --manifest "${RUN_MANIFEST}" \
            --artifact-manifest "${RUN_DIR}/artifact-manifest.json" \
            --pyproject "${PROVISION_DIR}/experiment-metrics/pyproject.toml"

      - name: Upload cavity3D result
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-cavity3d-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.v2_context.outputs.run_dir }}/results
          if-no-files-found: error
          compression-level: 0

      - name: Cleanup provisioned runtime
        if: always()
        run: |
          if [[ -n "${PJM_JOB_ID:-}" ]]; then
            pjdel "${PJM_JOB_ID}" 2>/dev/null || true
            pjwait -z "${PJM_JOB_ID}" || true
          fi
          rm -rf -- "${PROVISION_DIR:?}"

  archive-artifacts:
    name: Archive artifacts on home server
    needs: run
    if: always()
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Connect to home server through Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:apac-hpc-ai-actions
          ping: tomokazu-ubuntu-server

      - name: Configure SSH
        env:
          ARTIFACT_SERVER_SSH_PRIVATE_KEY: ${{ secrets.ARTIFACT_SERVER_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${ARTIFACT_SERVER_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 0600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan -H tomokazu-ubuntu-server >> "${HOME}/.ssh/known_hosts"

      - name: Copy artifacts to home server
        run: |
          ssh tomokazu@tomokazu-ubuntu-server "mkdir -p -- /hdd_raid/samba/net_share/openfoam-artifacts/${GITHUB_RUN_ID}"
          scp -r artifacts/. "tomokazu@tomokazu-ubuntu-server:/hdd_raid/samba/net_share/openfoam-artifacts/${GITHUB_RUN_ID}/"

      - name: Delete copied GitHub artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r artifact_id
          do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

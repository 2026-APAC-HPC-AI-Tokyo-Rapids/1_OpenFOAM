name: OpenFOAM on Genkai

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: boolean
      node_count:
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  BUILD_ARCHIVE_DIR: /home/pj26000080/share/openfoam-build/builds
  GIT_MIRROR_DIR: /fast/pj26000080/git-mirror
  OPENFOAM_SOURCE_OID: 5a55da3fb12800863bf76122c50bb0850222cab0
  THIRDPARTY_SOURCE_OID: 1eb943261ee0c0f7c5ec180dc012ce8d3b8777e0

defaults:
  run:
    shell: bash --login -eo pipefail {0}

jobs:
  select-build:
    name: Select OpenFOAM build
    runs-on: [self-hosted, genkai]

    outputs:
      action: ${{ steps.select.outputs.action }}
      experiment_preset: ${{ steps.protocol.outputs.experiment_preset }}
      prepare_script_sha256: ${{ steps.prepare_identity.outputs.sha256 }}
      source_archive_key: ${{ steps.select.outputs.source_archive_key }}
      build_cache_key: ${{ steps.select.outputs.build_cache_key }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identify case preparation
        id: prepare_identity
        run: echo "sha256=$(sha256sum scripts/prepare-openfoam-case.sh | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Resolve experiment protocol
        id: protocol
        run: |
          case '${{ inputs.node_count }}' in
            1) experiment_preset=scotch-1n-120r ;;
            2) experiment_preset=scotch-2n-240r ;;
            4) experiment_preset=scotch-4n-448r ;;
            *) echo 'Genkai node count must be 1, 2, or 4' >&2; exit 64 ;;
          esac
          echo "experiment_preset=${experiment_preset}" >> "${GITHUB_OUTPUT}"

      - name: Select an existing archive or a new build
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            commit_message="$(git log -1 --format=%B "${GITHUB_SHA}")"
            if [[ "${commit_message}" == '[require-build]'* ]]; then
              echo "The commit requests a new OpenFOAM build"
              printf 'action=build\nbuild_cache_key=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          commit="${GITHUB_SHA}"
          while [[ -n "${commit}" ]]
          do
            while IFS= read -r run_id
            do
              [[ "${run_id}" != "${GITHUB_RUN_ID}" ]] || continue
              archive="${BUILD_ARCHIVE_DIR}/${run_id}.tar.zst"
              sidecar="${BUILD_ARCHIVE_DIR}/${run_id}.build-sidecar.json"
              expected_size="$(jq -er 'select(.schema_version == "build-sidecar/v1" and .build_archive.path == "build.tar.zst") | .build_archive.size_bytes' "${sidecar}")" || continue
              expected_sha="$(jq -er '.build_archive.sha256' "${sidecar}")" || continue
              [[ "$(stat -c '%s' "${archive}")" == "${expected_size}" ]] || continue
              [[ "$(sha256sum "${archive}" | awk '{print $1}')" == "${expected_sha}" ]] || continue
              echo "Selected latest available ancestor build ${archive}"
              printf 'action=reuse\nsource_archive_key=%s\nbuild_cache_key=%s\n' "${run_id}" "${run_id}" >> "${GITHUB_OUTPUT}"
              exit 0
            done < <(gh run list --workflow openfoam.yml --commit "${commit}" --limit 1000 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
            commit="$(git rev-parse "${commit}^" 2>/dev/null || true)"
          done

          echo "No reusable OpenFOAM build archive was found; falling back to a new build"
          printf 'action=build\nbuild_cache_key=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  reuse-build:
    name: Reuse OpenFOAM build
    needs: select-build
    if: needs.select-build.outputs.action == 'reuse'
    runs-on: [self-hosted, genkai]

    steps:
      - name: Hardlink selected archive
        run: |
          source_key=${{ needs.select-build.outputs.source_archive_key }}
          ln -f -- "${BUILD_ARCHIVE_DIR}/${source_key}.tar.zst" "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_ID}.tar.zst"
          ln -f -- "${BUILD_ARCHIVE_DIR}/${source_key}.build-sidecar.json" "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_ID}.build-sidecar.json"

  build-openfoam:
    name: Build OpenFOAM
    needs: select-build
    if: needs.select-build.outputs.action == 'build'
    runs-on: [self-hosted, genkai]

    concurrency:
      group: genkai-openfoam-build

    env:
      BUILD_DIR: /dev/shm/openfoam-build/run-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_ARCHIVE_CACHE_DIR: /home/pj26000080/share/openfoam-build/source-cache

    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v7

      - name: Build and publish OpenFOAM
        run: '"${GITHUB_WORKSPACE}/scripts/build-openfoam.sh"'

      - name: Upload OpenFOAM build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-genkai-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_DIR }}/logs
          if-no-files-found: warn
          compression-level: 1

      - name: Cleanup OpenFOAM build directory
        if: always()
        run: rm -rf -- "${BUILD_DIR:?}"

  provision:
    name: Provision OpenFOAM runtime
    needs: [select-build, reuse-build, build-openfoam]
    if: >-
      always() &&
      needs.select-build.result == 'success' &&
      ((needs.select-build.outputs.action == 'reuse' && needs.reuse-build.result == 'success') ||
       (needs.select-build.outputs.action == 'build' && needs.build-openfoam.result == 'success'))
    runs-on: [self-hosted, genkai]
    outputs:
      provision_dir: ${{ steps.provision_runtime.outputs.provision_dir }}

    env:
      OPENFOAM_RUNTIME_ROOT: /fast/pj26000080/openfoam-provisioning

    steps:
      - name: Checkout runtime files
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Provision OpenFOAM runtime
        id: provision_runtime
        run: |
          install -d -m 2775 "${OPENFOAM_RUNTIME_ROOT}"
          provision_dir="$(mktemp -d "${OPENFOAM_RUNTIME_ROOT}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          echo "provision_dir=${provision_dir}" >> "${GITHUB_OUTPUT}"
          mkdir -p "${provision_dir}/benchmark" "${provision_dir}/control" "${provision_dir}/scripts" "${provision_dir}/logs" "${provision_dir}/results"
          archive="${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_ID}.tar.zst"
          sidecar="${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_ID}.build-sidecar.json"
          expected_size="$(jq -er '.build_archive.size_bytes' "${sidecar}")"
          expected_sha="$(jq -er '.build_archive.sha256' "${sidecar}")"
          test "$(stat -c '%s' "${archive}")" = "${expected_size}"
          test "$(sha256sum "${archive}" | awk '{print $1}')" = "${expected_sha}"
          install -m 0644 "${sidecar}" "${provision_dir}/control/build-sidecar.json"
          install -m 0755 "${GITHUB_WORKSPACE}/scripts/run-openfoam.sh" "${GITHUB_WORKSPACE}/scripts/prepare-openfoam-case.sh" "${GITHUB_WORKSPACE}/scripts/exec-profiler.sh" "${GITHUB_WORKSPACE}/scripts/allow-vtune-attach.py" "${GITHUB_WORKSPACE}/scripts/export-vtune-hotspots.sh" "${provision_dir}/scripts/"
          install -m 0755 "${GITHUB_WORKSPACE}/platforms/genkai/run-openfoam.pjm" "${GITHUB_WORKSPACE}/platforms/genkai/prepare-openfoam-case.pjm" "${provision_dir}/scripts/"
          install -m 0755 "${GITHUB_WORKSPACE}/benchmark/parse_result.sh" "${provision_dir}/benchmark/"
          cp -a "${GITHUB_WORKSPACE}/benchmark/occDrivAerStaticMesh" "${provision_dir}/benchmark/"
          install -m 0644 "${GITHUB_WORKSPACE}/benchmark/workload.json" "${provision_dir}/benchmark/workload.json"
          cp -a "${GITHUB_WORKSPACE}/experiment-metrics" "${provision_dir}/experiment-metrics"
          uv sync --project "${provision_dir}/experiment-metrics" --frozen --no-dev
          # Keep OpenFOAM headers and wmake: the official coded wall-clock function object compiles on first use.
          tar -I zstd -xf "${archive}" -C "${provision_dir}" --exclude='*.o' --exclude='./OpenFOAM/applications' --exclude='./ThirdParty/build' --exclude='./ThirdParty/sources' --exclude='*.cmake' --exclude='CMakeFiles' --exclude='CMakeCache.txt' --exclude='compile_commands.json' --exclude='install_manifest.txt' --exclude='Makefile'

      - name: Cleanup failed OpenFOAM provisioning
        if: failure() && steps.provision_runtime.outputs.provision_dir != ''
        env:
          PROVISION_DIR: ${{ steps.provision_runtime.outputs.provision_dir }}
        run: rm -rf -- "${PROVISION_DIR:?}"

  prepare-case:
    name: Prepare OpenFOAM case cache
    needs: [select-build, provision]
    if: always() && needs.provision.result == 'success'
    runs-on: [self-hosted, genkai]

    concurrency:
      group: genkai-openfoam-case-${{ needs.select-build.outputs.experiment_preset }}-${{ needs.select-build.outputs.prepare_script_sha256 }}-${{ needs.select-build.outputs.build_cache_key }}

    env:
      PROVISION_DIR: ${{ needs.provision.outputs.provision_dir }}

    steps:
      - name: Stage mesh, validate it, and decompose when uncached
        run: |
          experiment_preset='${{ needs.select-build.outputs.experiment_preset }}'
          [[ "${experiment_preset}" =~ ^[a-z0-9-]+$ ]]
          protocol_path="${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2-protocol-${experiment_preset}.toml"
          prepare_subdomains="$(sed -n 's/^ranks = \([0-9][0-9]*\)$/\1/p' "${protocol_path}" | sort -u)"
          [[ "${prepare_subdomains}" =~ ^[1-9][0-9]*$ ]]
          case "${experiment_preset}" in
            scotch-*) prepare_decomposition_profile=scotch ;;
            *) echo "unsupported decomposition preset: ${experiment_preset}" >&2; exit 64 ;;
          esac
          prepare_root="/fast/pj26000080/openfoam-case-prepare/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${prepare_root}"
          workload_dir="/home/pj26000080/share/openfoam-workload"
          workload_archive="${workload_dir}/polyMesh_65M.tar.gz"
          workload_temporary="${workload_archive}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tmp"
          install -d -m 2775 "${workload_dir}"
          trap 'rm -f -- "${workload_temporary}"' EXIT
          if [[ ! -f "${workload_archive}" || "$(stat -c '%s' "${workload_archive}")" != "$(jq -r '.mesh.size_bytes' "${PROVISION_DIR}/benchmark/workload.json")" || "$(sha256sum "${workload_archive}" | awk '{print $1}')" != "$(jq -r '.mesh.sha256' "${PROVISION_DIR}/benchmark/workload.json")" ]]; then
            curl --fail --location --retry 3 "$(jq -r '.mesh.url' "${PROVISION_DIR}/benchmark/workload.json")" --output "${workload_temporary}"
            test "$(stat -c '%s' "${workload_temporary}")" = "$(jq -r '.mesh.size_bytes' "${PROVISION_DIR}/benchmark/workload.json")"
            test "$(md5sum "${workload_temporary}" | awk '{print $1}')" = "$(jq -r '.mesh.md5' "${PROVISION_DIR}/benchmark/workload.json")"
            test "$(sha256sum "${workload_temporary}" | awk '{print $1}')" = "$(jq -r '.mesh.sha256' "${PROVISION_DIR}/benchmark/workload.json")"
            mv -- "${workload_temporary}" "${workload_archive}"
          fi
          trap - EXIT
          cleanup() {
            original_status=$?
            if [[ -n "${job_id:-}" ]]; then
              pjdel "${job_id}" 2>/dev/null || true
              pjwait -z "${job_id}" 2>/dev/null || true
            fi
            rm -rf -- "${prepare_root}"
            if [[ "${original_status}" -ne 0 ]]; then
              rm -rf -- "${PROVISION_DIR:?}"
            fi
          }
          trap cleanup EXIT
          prepare_cache_root="${HOME}/../share/openfoam-case-cache"
          submission="$(pjsub -L rscgrp=a-batch -L node=1 --mpi proc=1 -x "PREPARE_CACHE_ROOT=${prepare_cache_root},PREPARE_DECOMPOSITION_PROFILE=${prepare_decomposition_profile},PREPARE_SUBDOMAINS=${prepare_subdomains},PROVISION_DIR=${PROVISION_DIR},WORKLOAD_MESH_ARCHIVE=${workload_archive}" -o "${prepare_root}/%j.pjm.log" -j -N openfoam_prepare "${PROVISION_DIR}/scripts/prepare-openfoam-case.pjm")"
          printf '%s\n' "${submission}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<< "${submission}")"
          test -n "${job_id}"
          pjwait -z "${job_id}"
          pjwait "${job_id}"
          cat "${prepare_root}/${job_id}.pjm.log"
          cache_dir="$(sed -n 's/^cache_dir=//p' "${prepare_root}/${job_id}.pjm.log" | tail -n 1)"
          [[ "${cache_dir}" == "${HOME}/../share/openfoam-case-cache/"* ]]

  run:
    name: Run OpenFOAM
    needs: [select-build, provision, prepare-case]
    if: >-
      always() &&
      needs.provision.result == 'success' &&
      needs.prepare-case.result == 'success'
    runs-on: [self-hosted, genkai]
    outputs:
      artifact_uploaded: ${{ steps.upload_v2.outcome == 'success' }}
    env:
      OPENFOAM_RUN_ROOT: /fast/pj26000080/openfoam-runs
      PROVISION_DIR: ${{ needs.provision.outputs.provision_dir }}

    steps:
      - name: Checkout control-plane identity
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize metrics and submit OpenFOAM
        id: v2_context
        env:
          METRICS_CREDENTIAL_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
        run: |
          install -d -m 2775 "${OPENFOAM_RUN_ROOT}"
          test -n "${METRICS_CREDENTIAL_JSON}"
          staging_credential="${OPENFOAM_RUN_ROOT}/.bigquery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          install -m 0600 /dev/null "${staging_credential}"
          printf '%s' "${METRICS_CREDENTIAL_JSON}" >"${staging_credential}"
          trap 'rm -f -- "${staging_credential}"' EXIT
          export EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE="${staging_credential}"
          export EXPERIMENT_METRICS_BIGQUERY_CONFIG="${PROVISION_DIR}/experiment-metrics/pyproject.toml"
          uv sync --project "${PROVISION_DIR}/experiment-metrics" --frozen --no-dev --extra publish
          experiment_preset='${{ needs.select-build.outputs.experiment_preset }}'
          [[ "${experiment_preset}" =~ ^[a-z0-9-]+$ ]]
          protocol_relative="experiment-metrics/registry/openfoam-v2-protocol-${experiment_preset}.toml"
          protocol_path="${PROVISION_DIR}/${protocol_relative}"
          head_commit="$(git rev-parse HEAD)"
          base_commit="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || printf '%s' "${head_commit}")"
          if [[ '${{ inputs.profile }}' == true ]]; then
            purpose=profile
            bundle_path="${GITHUB_WORKSPACE}/experiment-metrics/bundles/openfoam-profile-vtune-hotspots-v1.json"
          else
            purpose=bench
            bundle_path="${GITHUB_WORKSPACE}/experiment-metrics/bundles/openfoam-score-v1.json"
          fi
          bundle_sha256=$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" bundle-identity --bundle "${bundle_path}" --purpose "${purpose}")
          control_plane_files=(.github/workflows/genkai.yml .github/workflows/openfoam.yml benchmark/parse_result.sh benchmark/workload.json "${protocol_relative}" experiment-metrics/registry/openfoam-v2.toml)
          if [[ "${purpose}" == profile ]]; then
            control_plane_files+=(experiment-metrics/src/experiment_metrics/profile_vtune.py scripts/allow-vtune-attach.py scripts/exec-profiler.sh scripts/export-vtune-hotspots.sh)
          fi
          control_plane_files+=(platforms/genkai/prepare-openfoam-case.pjm platforms/genkai/run-openfoam.pjm scripts/prepare-openfoam-case.sh scripts/run-openfoam.sh)
          readarray -t control_plane_files < <(printf '%s\n' "${control_plane_files[@]}" | LC_ALL=C sort -u)
          control_plane_args=()
          for control_plane_file in "${control_plane_files[@]}"; do control_plane_args+=(--control-plane-file "${control_plane_file}"); done
          identities=$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" source-track-identities --repository "${GITHUB_WORKSPACE}" --purpose "${purpose}" --base-commit "${base_commit}" --instrumentation-bundle-sha256 "${bundle_sha256}" "${control_plane_args[@]}")
          manifest="$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" init-run --runtime-root "${OPENFOAM_RUN_ROOT}" --purpose "${purpose}" --identities-json "${identities}" --repository-id apac2026-openfoam --instrumentation-bundle "${bundle_path}" --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml")"
          run_dir="$(dirname "$(dirname "${manifest}")")"
          run_id="$(basename "${run_dir}")"
          credential_file="${run_dir}/control/bigquery-credential.json"
          mv -- "${staging_credential}" "${credential_file}"
          trap - EXIT
          trap 'rm -f -- "${credential_file}"' EXIT
          export EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE="${credential_file}"
          install -m 0644 "${PROVISION_DIR}/control/build-sidecar.json" "${run_dir}/control/build-sidecar.json"
          cp -a "${PROVISION_DIR}/control/build-raw" "${run_dir}/control/build-raw"
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" record-artifact-index --manifest "${manifest}" --runtime-dir "${run_dir}" --build-sidecar "${run_dir}/control/build-sidecar.json"
          printf 'run_id=%s\nmanifest=%s\nrun_dir=%s\n' "${run_id}" "${manifest}" "${run_dir}" >> "${GITHUB_OUTPUT}"
          printf 'RUN_ID=%s\nRUN_MANIFEST=%s\nRUN_DIR=%s\nEXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE=%s\nEXPERIMENT_METRICS_BIGQUERY_CONFIG=%s\nOPENFOAM_PROTOCOL_PATH=%s\n' "${run_id}" "${manifest}" "${run_dir}" "${credential_file}" "${PROVISION_DIR}/experiment-metrics/pyproject.toml" "${protocol_path}" >> "${GITHUB_ENV}"
          export RUN_ID="${run_id}"
          export RUN_MANIFEST="${manifest}"
          export RUN_DIR="${run_dir}"
          export OPENFOAM_PROTOCOL_PATH="${protocol_path}"
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" smoke-send --run "${RUN_ID}" --source runner
          trap - EXIT
          job_id="$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" submit-run --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" --protocol "${OPENFOAM_PROTOCOL_PATH}" --pjm-script-repository-path platforms/genkai/run-openfoam.pjm --execution-script "${PROVISION_DIR}/scripts/run-openfoam.pjm" --provision-dir "${PROVISION_DIR}")"
          test -n "${job_id}"
          echo "PJM_JOB_ID=${job_id}" >> "${GITHUB_ENV}"
          echo "pjm_job_id=${job_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for OpenFOAM job
        run: |
          # The PJM record is durable inside RUN_DIR; follow it only for
          # scheduler diagnostics while solver stdout/stderr remains combined.
          tail --lines=+1 --follow=name --retry "${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log" &
          stream_pid=$!
          stop_stream() {
            kill "${stream_pid}" 2>/dev/null || true
            wait "${stream_pid}" 2>/dev/null || true
          }
          trap stop_stream EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          pjwait -z "${PJM_JOB_ID}"
          sleep 1
          pjwait "${PJM_JOB_ID}"
          if [[ ! -e "${RUN_DIR}/run-success" ]]; then
            echo 'OpenFOAM job did not create run-success' >&2
            tail -n 240 "${RUN_DIR}/logs/${PJM_JOB_ID}.pjm.log" >&2 || true
            tail -n 240 "${RUN_DIR}/logs/solver.log" >&2 || true
            exit 1
          fi

      - name: Publish VTune hotspots to Actions summary
        if: success() && inputs.profile
        run: |
          summary="${RUN_DIR}/profile/raw/vtune-summary/summary.md"
          cat "${summary}" >> "${GITHUB_STEP_SUMMARY}" || printf '## Intel VTune hotspots\n\nCollection or report generation was unavailable.\n' >> "${GITHUB_STEP_SUMMARY}"
          vtune_result_dir="$(sed -n 's/^vtune_result_dir=//p' "${RUN_DIR}/logs/profile-location.txt" 2>/dev/null || true)"
          if [[ -n "${vtune_result_dir}" ]]; then
            {
              printf '\nVTune result on Genkai:\n\n'
              printf -- "- \`%s\`\n" "${vtune_result_dir}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Finalize metrics and package artifacts
        id: package_v2
        if: always() && steps.v2_context.outputs.pjm_job_id != ''
        run: |
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" record-scheduler-terminal --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" --job-id "${PJM_JOB_ID}" || true
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" record-solver-log --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" --log "${RUN_DIR}/logs/solver.log" --protocol "${OPENFOAM_PROTOCOL_PATH}" || true
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" record-execution-context --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" --protocol "${OPENFOAM_PROTOCOL_PATH}" --host-snapshot "${RUN_DIR}/source/env/host-exec.snapshot" --placement-root "${RUN_DIR}/source/placement" --scheduler-request "${RUN_DIR}/control/scheduler-request.json" --scheduler-accounting "${RUN_DIR}/control/scheduler-accounting.json" --decompose-dict "${RUN_DIR}/source/mesh/decomposeParDict" --solver-log "${RUN_DIR}/logs/solver.log" || true
          args=(package --manifest "${RUN_MANIFEST}")
          for pair in 'control/run-manifest.json:run_manifest' 'control/instrumentation-bundle.json:instrumentation_bundle' 'control/build-sidecar.json:build_sidecar' 'control/build-provision-validation.json:build_provision_validation' 'control/job-entry.json:job_entry' 'control/scheduler-accounting.json:scheduler_accounting' 'control/scheduler-request.json:scheduler_request' 'control/scheduler-terminal.json:scheduler_terminal' 'control/submission-result.json:scheduler_submission_result' 'logs/checkMesh.log:check_mesh_log' 'logs/decomposePar.log:decompose_par_log' 'logs/renumberMesh.log:renumber_mesh_log' 'logs/potentialFoam.log:potential_foam_log' 'logs/applyBoundaryLayer.log:apply_boundary_layer_log' 'logs/profile-location.txt:postrun_source' 'logs/solver.log:solver_log' "logs/${PJM_JOB_ID}.pjm.log:pjm_log" 'results/result.txt:official_result' 'source/env/host-exec.snapshot:host_exec_environment' 'source/env/job-entry.snapshot:job_entry_environment' 'source/network/imb-mpi1/argv.json:imb_mpi1_argv' 'source/network/imb-mpi1/stderr.txt:imb_mpi1_stderr' 'source/network/imb-mpi1/stdout.txt:imb_mpi1_stdout' 'source/scheduler/accounting.stderr:scheduler_accounting_stderr' 'source/scheduler/accounting.stdout:scheduler_accounting_stdout' 'source/scheduler/submission.stderr:scheduler_submission_stderr' 'source/scheduler/submission.stdout:scheduler_submission_stdout'
          do
            relative="${pair%%:*}"
            if [[ -f "${RUN_DIR}/${relative}" ]]; then
              args+=(--member "${pair}")
            fi
          done
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:rank_placement")
          done < <(find "${RUN_DIR}/source/placement" -type f -name 'rank-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:minimal_hardware")
          done < <(find "${RUN_DIR}/source/hardware" -type f -name 'node-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:postrun_source")
          done < <(find "${RUN_DIR}/source/hardware" -type f ! -name 'node-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:postrun_source")
          done < <(find "${RUN_DIR}/source/mesh" "${RUN_DIR}/source/build-provision" -type f -print0 | sort -z)
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:build_raw")
          done < <(find "${RUN_DIR}/control/build-raw" -type f -print0 | sort -z)
          args+=(--member 'source/workload-manifest.json:workload_manifest')
          while IFS= read -r -d '' path; do
            args+=(--member "${path#"${RUN_DIR}/"}:workload_member")
          done < <(find "${RUN_DIR}/source/workload" -type f -print0 | sort -z)
          if [[ '${{ inputs.profile }}' == true ]]; then
            while IFS= read -r -d '' path; do
              args+=(--profile-member "${path#"${RUN_DIR}/"}")
            done < <(find "${RUN_DIR}/profile/raw" -type f -print0 | sort -z)
          fi
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" "${args[@]}"
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" send-fragments --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}"

      - name: Upload fixed v2 artifact set
        id: upload_v2
        if: always() && steps.v2_context.outputs.pjm_job_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-genkai-v2-${{ steps.v2_context.outputs.run_id }}
          path: |
            ${{ steps.v2_context.outputs.run_dir }}/artifact-manifest.json
            ${{ steps.v2_context.outputs.run_dir }}/run-artifacts.tar.zst
            ${{ steps.v2_context.outputs.run_dir }}/profile-raw.tar.zst
          if-no-files-found: error
          compression-level: 0

      - name: Upload occDrivAerStaticMesh result
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-genkai-occdrivaer-65m-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.v2_context.outputs.run_dir }}/results
          if-no-files-found: error
          compression-level: 0

      - name: Cleanup provisioned runtime
        if: always()
        run: |
          rm -f -- "${EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE:-}"
          if [[ -n "${PJM_JOB_ID:-}" ]]; then
            pjdel "${PJM_JOB_ID}" 2>/dev/null || true
            pjwait -z "${PJM_JOB_ID}" || true
          fi
          rm -rf -- "${PROVISION_DIR:?}"

  archive-artifacts:
    name: Archive artifacts on home server
    needs: run
    if: always() && needs.run.outputs.artifact_uploaded == 'true'
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "openfoam-genkai-*"

      - name: Connect to home server through Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:apac-hpc-ai-actions
          ping: tomokazu-ubuntu-server

      - name: Configure SSH
        env:
          ARTIFACT_SERVER_SSH_PRIVATE_KEY: ${{ secrets.ARTIFACT_SERVER_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${ARTIFACT_SERVER_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 0600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan -H tomokazu-ubuntu-server >> "${HOME}/.ssh/known_hosts"

      - name: Copy artifacts to home server
        run: |
          ssh tomokazu@tomokazu-ubuntu-server mkdir -p -- "/hdd_raid/samba/net_share/openfoam-artifacts/${GITHUB_RUN_ID}/genkai"
          scp -r artifacts/. "tomokazu@tomokazu-ubuntu-server:/hdd_raid/samba/net_share/openfoam-artifacts/${GITHUB_RUN_ID}/genkai/"

      - name: Delete copied GitHub artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("openfoam-genkai-")) | .id' | while read -r artifact_id; do gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"; done

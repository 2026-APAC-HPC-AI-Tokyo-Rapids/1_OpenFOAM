name: OpenFOAM on genkai

on:
  workflow_dispatch:
    inputs:
      require_build:
        description: Build from source instead of reusing the nearest successful archive from the first-parent history
        required: true
        default: false
        type: boolean
  push:
    paths-ignore:
      - 'research/**'
      - '**/.md'

permissions:
  actions: read
  contents: read

env:
  BUILD_ARCHIVE_DIR: /home/pj26000080/share/openfoam-build/builds

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    name: Build OpenFOAM
    runs-on: [self-hosted, genkai]
    # 共有ソースアーカイブキャッシュへの同時書き込みを防ぐ。
    concurrency:
      group: genkai-openfoam-build
      cancel-in-progress: false

    env:
      # ビルド対象のバージョンと並列数
      OPENFOAM_VERSION: v2606
      ADIOS2_VERSION: 2.12.1
      CGAL_VERSION: 6.1.1
      OPENFOAM_BUILD_PARALLELISM: 120
      SKIP_BUILD: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[require-build]')) || (github.event_name == 'workflow_dispatch' && !inputs.require_build) }}

      # 永続化するソースアーカイブ
      SOURCE_ARCHIVE_CACHE_DIR: /home/pj26000080/share/openfoam-build/source-cache

      # OpenFOAMのwmakeとThirdPartyのCMakeビルドで使うコンパイラ設定
      CC: mpiicx
      CXX: mpiicpx
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Link previous build archive
        if: ${{ fromJSON(env.SKIP_BUILD) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="${GITHUB_SHA}"
          # 互換性は呼び出し側が判断し、workflowでは第一親上の実ビルド成果物だけを探す。
          while parent_commit="$(git rev-parse "${commit}^" 2>/dev/null)"
          do
            run_info="$(gh run list --workflow genkai.yml --commit "${parent_commit}" --status success --limit 1 --json databaseId,number --jq '(.[0] // empty) | [.databaseId, .number] | @tsv')"
            if [[ -n "${run_info}" ]]; then
              read -r run_id run_number <<< "${run_info}"
              archive="${BUILD_ARCHIVE_DIR}/${run_number}.tar.zst"
              archive_step_count="$(gh run view "${run_id}" --json jobs --jq '[.jobs[].steps[] | select(.name == "Archive OpenFOAM build" and .conclusion == "success")] | length')"
              if [[ "${archive_step_count}" -gt 0 && -e "${archive}" ]]; then
                echo "Reusing ${archive}"
                ln -f "${archive}" "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.tar.zst"
                exit 0
              fi
            fi
            commit="${parent_commit}"
          done
          echo "No reusable OpenFOAM build archive was found in the first-parent history" >&2
          exit 1

      - name: Download source archives
        if: ${{ ! fromJSON(env.SKIP_BUILD) }}
        run: |
          mkdir -p "${SOURCE_ARCHIVE_CACHE_DIR}"
          for archive_url in \
            "https://dl.openfoam.com/source/${OPENFOAM_VERSION}/OpenFOAM-${OPENFOAM_VERSION}.tgz" \
            "https://dl.openfoam.com/source/${OPENFOAM_VERSION}/ThirdParty-${OPENFOAM_VERSION}.tar.gz" \
            "https://github.com/ornladios/ADIOS2/archive/refs/tags/v${ADIOS2_VERSION}.tar.gz" \
            "https://github.com/CGAL/cgal/releases/download/v${CGAL_VERSION}/CGAL-${CGAL_VERSION}.tar.xz"
          do
            wget --no-verbose --no-clobber --directory-prefix="${SOURCE_ARCHIVE_CACHE_DIR}" "${archive_url}"
          done

      - name: Prepare build workspace
        if: ${{ ! fromJSON(env.SKIP_BUILD) }}
        id: prepare_build_workspace
        run: |
          run_tmpdir="$(mktemp -d "/dev/shm/openfoam-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          # ccacheの一時ファイルはビルド成果物アーカイブに含めない。
          {
            echo "RUN_TMPDIR=${run_tmpdir}"
            echo "OPENFOAM_BUILD_TMPDIR=${run_tmpdir}/build"
            echo "CCACHE_BASEDIR=${run_tmpdir}/build"
            echo "CCACHE_TEMPDIR=${run_tmpdir}/ccache"
          } >> "${GITHUB_ENV}"
          mkdir -p "${run_tmpdir}/build/logs" "${run_tmpdir}/ccache"

      - name: Extract and patch sources
        if: ${{ ! fromJSON(env.SKIP_BUILD) }}
        run: |
          tar -xzf "${SOURCE_ARCHIVE_CACHE_DIR}/OpenFOAM-${OPENFOAM_VERSION}.tgz" -C "${OPENFOAM_BUILD_TMPDIR}"
          tar -xzf "${SOURCE_ARCHIVE_CACHE_DIR}/ThirdParty-${OPENFOAM_VERSION}.tar.gz" -C "${OPENFOAM_BUILD_TMPDIR}"
          thirdparty_source_dir="${OPENFOAM_BUILD_TMPDIR}/ThirdParty-${OPENFOAM_VERSION}"
          mkdir -p "${thirdparty_source_dir}/sources/adios" "${thirdparty_source_dir}/sources/cgal"
          tar -xzf "${SOURCE_ARCHIVE_CACHE_DIR}/v${ADIOS2_VERSION}.tar.gz" -C "${thirdparty_source_dir}/sources/adios"
          tar -xJf "${SOURCE_ARCHIVE_CACHE_DIR}/CGAL-${CGAL_VERSION}.tar.xz" -C "${thirdparty_source_dir}/sources/cgal"
          mv "${OPENFOAM_BUILD_TMPDIR}/OpenFOAM-${OPENFOAM_VERSION}" "${OPENFOAM_BUILD_TMPDIR}/OpenFOAM"
          mv "${thirdparty_source_dir}" "${OPENFOAM_BUILD_TMPDIR}/ThirdParty"
          ln -s ../ThirdParty "${OPENFOAM_BUILD_TMPDIR}/OpenFOAM/ThirdParty"
          for patch_file in "${GITHUB_WORKSPACE}"/patches/*.patch
          do
            patch -d "${OPENFOAM_BUILD_TMPDIR}" -p0 < "${patch_file}"
          done

      - name: Build OpenFOAM
        if: ${{ ! fromJSON(env.SKIP_BUILD) }}
        run: |
          module purge
          module load intel/2025.1.3 impi
          for build_tool in "${CC}" "${CXX}" ccache
          do
            "${build_tool}" --version
          done
          ccache --show-config
          # OpenFOAMのbashrcは未定義変数や途中コマンドの終了値を許容するため、読み込み中だけ厳格モードを外す。
          set +eu
          source "${OPENFOAM_BUILD_TMPDIR}/OpenFOAM/etc/bashrc" \
            WM_COMPILER=Icx \
            WM_MPLIB=INTELMPI \
            WM_LABEL_SIZE=64 \
            WM_PRECISION_OPTION=DP \
            WM_COMPILE_CONTROL=+ccache
          set -eu
          # OpenFOAMのリンク時にThirdPartyのFFTWライブラリを参照可能にする。
          export LD_LIBRARY_PATH="${FFTW_ARCH_PATH}/lib:${LD_LIBRARY_PATH:-}"
          export FOAM_EXTRA_LDFLAGS="-Wl,-rpath-link,${FFTW_ARCH_PATH}/lib"
          cd "${WM_PROJECT_DIR}"
          # このAllwmakeのcache hit/missだけを記録する。
          ccache --zero-stats
          "${GITHUB_WORKSPACE}/scripts/build-profiler.sh" \
            bash -o pipefail ./Allwmake -j "${OPENFOAM_BUILD_PARALLELISM}" -s \
              -log="${OPENFOAM_BUILD_TMPDIR}/logs/allwmake.log" > /dev/null || {
            build_status=$?
            grep -Eai -m 200 \
              '(^|[[:space:]])(fatal[[:space:]]+)?error([[:space:](]|:)|undefined reference|collect2:|make(\[[0-9]+\])?: \*\*\*|wmake error' \
              "${OPENFOAM_BUILD_TMPDIR}/logs/allwmake.log" >&2 || true
            exit "${build_status}"
          }
          ccache --show-stats

      - name: Archive OpenFOAM build
        if: ${{ ! fromJSON(env.SKIP_BUILD) }}
        run: tar -I zstd -cf "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.tar.zst" -C "${OPENFOAM_BUILD_TMPDIR}" .

      - name: Upload OpenFOAM build log
        if: always() && steps.prepare_build_workspace.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OPENFOAM_BUILD_TMPDIR }}/logs
          if-no-files-found: warn
          compression-level: 1

      - name: Cleanup build workspace
        if: always() && steps.prepare_build_workspace.outcome == 'success'
        run: rm -rf -- "${RUN_TMPDIR:?}"

  provision:
    name: Provision OpenFOAM runtime
    needs: build
    runs-on: [self-hosted, genkai]

    outputs:
      provision_dir: ${{ steps.provision_runtime.outputs.provision_dir }}

    env:
      OPENFOAM_RUNTIME_ROOT: /fast/pj26000080/openfoam-provisioning

    steps:
      - name: Checkout run scripts
        uses: actions/checkout@v6

      - name: Provision OpenFOAM runtime
        id: provision_runtime
        run: |
          mkdir -p "${OPENFOAM_RUNTIME_ROOT}"
          provision_dir="$(mktemp -d "${OPENFOAM_RUNTIME_ROOT}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          mkdir -p "${provision_dir}/scripts" "${provision_dir}/logs" "${provision_dir}/results"
          cp "${GITHUB_WORKSPACE}/scripts/run-openfoam.sh" "${provision_dir}/scripts/"
          cp "${GITHUB_WORKSPACE}/scripts/exec-profiler.sh" "${provision_dir}/scripts/"
          chmod +x "${provision_dir}/scripts/"*.sh
          # Keep all installed runtime dependencies, excluding source and build trees.
          tar -I zstd -xf "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.tar.zst" -C "${provision_dir}" \
            --exclude='*.o' \
            --exclude='*.C' \
            --exclude='*.H' \
            --exclude='*.c' \
            --exclude='*.h' \
            --exclude='./OpenFOAM/src' \
            --exclude='./OpenFOAM/applications' \
            --exclude='./OpenFOAM/wmake' \
            --exclude='./ThirdParty/build' \
            --exclude='./ThirdParty/sources' \
            --exclude='*.cmake' \
            --exclude='CMakeFiles' \
            --exclude='CMakeCache.txt' \
            --exclude='compile_commands.json' \
            --exclude='install_manifest.txt' \
            --exclude='Makefile'
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/simpleFoam"
          echo "provision_dir=${provision_dir}" >> "${GITHUB_OUTPUT}"

  run:
    name: Run OpenFOAM
    needs: provision
    runs-on: [self-hosted, genkai]

    env:
      OPENFOAM_RUN_ROOT: /fast/pj26000080/openfoam-runs
      OPENFOAM_MPI_PROCS: 120
      PROVISION_DIR: ${{ needs.provision.outputs.provision_dir }}

    steps:
      - name: Run and wait for OpenFOAM job
        run: |
          mkdir -p "${OPENFOAM_RUN_ROOT}"
          job_output="$(pjsub /dev/stdin <<PJM
          #!/usr/bin/env bash
          #PJM -L rscgrp=a-batch
          #PJM -L node=1
          #PJM -L elapse=00:05:00
          #PJM -j
          #PJM -o ${PROVISION_DIR}/logs/%j.log
          #PJM -N openfoam_run
          #PJM --mpi proc=${OPENFOAM_MPI_PROCS}

          set -eo pipefail
           run_dir="\$(mktemp -d "${OPENFOAM_RUN_ROOT}/job-\${PJM_JOBID}.XXXXXXXXXX")"
           trap 'rm -rf -- "\${run_dir}"' EXIT
           "${PROVISION_DIR}/scripts/run-openfoam.sh" "${PROVISION_DIR}" "\${run_dir}" "${OPENFOAM_MPI_PROCS}"
           touch "\${run_dir}/motorBike/motorBike.foam"
           tar -I zstd -cf "${PROVISION_DIR}/results/motorBike-\${PJM_JOBID}.tar.zst" -C "\${run_dir}" motorBike
           touch "${PROVISION_DIR}/run-success"
          PJM
          )"
          printf '%s\n' "${job_output}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<< "${job_output}")"
          test -n "${job_id}"
          log_file="${PROVISION_DIR}/logs/${job_id}.log"
          while [[ ! -e "${log_file}" ]]; do
            if ! pjstat "${job_id}" | grep -q "^${job_id}[[:space:]]"; then
              echo "OpenFOAM job ${job_id} did not create a scheduler log" >&2
              exit 1
            fi
            sleep 1
          done
          # Follow the scheduler log in the Actions output while the job runs.
          tail -n +1 -F "${log_file}" &
          tail_pid=$!
          stop_log_stream() {
            kill "${tail_pid}" 2>/dev/null || true
            wait "${tail_pid}" 2>/dev/null || true
          }
          trap stop_log_stream EXIT
          while pjstat "${job_id}" | grep -q "^${job_id}[[:space:]]"; do
            sleep 10
          done
          sleep 1
          stop_log_stream
          trap - EXIT
          test -e "${PROVISION_DIR}/run-success"

      - name: Upload OpenFOAM execution log
        if: ${{ always() && needs.provision.outputs.provision_dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-run-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROVISION_DIR }}/logs
          if-no-files-found: warn
          compression-level: 1

      - name: Upload ParaView case
        if: ${{ success() && needs.provision.outputs.provision_dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-motorbike-case-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROVISION_DIR }}/results
          if-no-files-found: error
          compression-level: 0

      - name: Cleanup provisioned runtime
        if: ${{ always() && needs.provision.outputs.provision_dir != '' }}
        run: rm -rf -- "${PROVISION_DIR:?}"

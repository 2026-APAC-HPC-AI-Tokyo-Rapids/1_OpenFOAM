name: OpenFOAM on genkai

on:
  workflow_dispatch:
  push:

jobs:
  openfoam:
    name: OpenFOAM template job
    runs-on:
      - self-hosted
      - genkai

    env:
      WORKDIR: /home/pj26000080/ku60000563/openfoam-runner
      OPENFOAM_VER: v2412
      BUILD_PARALLELISM: 60
      SOURCE_CACHE_DIR: /home/pj26000080/ku60000563/openfoam-runner/source-cache
      RESULT_DIR: /home/pj26000080/ku60000563/openfoam-runner/results
      BASH_ENV: ${HOME}/.bashrc

    defaults:
      run:
        shell: bash --noprofile --norc -o pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show runner context
        run: |
          hostname
          pwd

      - name: Prepare OpenFOAM source
        run: |
          set -uo pipefail

          mkdir -p "${SOURCE_CACHE_DIR}" "${RESULT_DIR}"

          openfoam_archive="${SOURCE_CACHE_DIR}/OpenFOAM-${OPENFOAM_VER}.tgz"
          thirdparty_archive="${SOURCE_CACHE_DIR}/ThirdParty-${OPENFOAM_VER}.tgz"

          wget --no-verbose --no-clobber --directory-prefix="${SOURCE_CACHE_DIR}" \
            "https://dl.openfoam.com/source/${OPENFOAM_VER}/OpenFOAM-${OPENFOAM_VER}.tgz" \
            "https://dl.openfoam.com/source/${OPENFOAM_VER}/ThirdParty-${OPENFOAM_VER}.tgz"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            build_tag="dispatch-$(date +%H%M%S)"
          else
            build_tag="${GITHUB_SHA::7}"
          fi

          final_build_root=${WORKDIR}/openfoam-build-${build_tag}
          temp_build_root="$(mktemp -d "/dev/shm/${USER}.XXXXXXXXXXX")"
          echo OPENFOAM_BUILD_ROOT=${final_build_root} >> ${GITHUB_ENV}
          echo OPENFOAM_BUILD_TMP_ROOT=${temp_build_root} >> ${GITHUB_ENV}
          echo "Using temporary build root: ${temp_build_root}"
          echo "Final build root: ${final_build_root}"

          echo "Extracting ${openfoam_archive}"
          tar xzf ${openfoam_archive} -C ${temp_build_root}
          echo "Extracting ${thirdparty_archive}"
          tar xzf ${thirdparty_archive} -C ${temp_build_root}

      - name: Fetch ADIOS2 source
        run: |
          set -uo pipefail

          adios2_version=ADIOS2-2.12.1
          adios2_archive="${SOURCE_CACHE_DIR}/ADIOS2-v2.12.1.tar.gz"
          adios2_source_root="${OPENFOAM_BUILD_TMP_ROOT}/ThirdParty-${OPENFOAM_VER}/sources/adios"

          mkdir -p "${adios2_source_root}"
          wget --no-verbose --no-clobber --output-document="${adios2_archive}" \
            "https://github.com/ornladios/ADIOS2/archive/refs/tags/v2.12.1.tar.gz"
          tar xzf "${adios2_archive}" -C "${adios2_source_root}"

      - name: Apply local patches
        run: |
          set -uo pipefail

          patch -d "${OPENFOAM_BUILD_TMP_ROOT}" -p0 \
            < "${GITHUB_WORKSPACE}/.github/patches/adios2-v2.12.1.patch"

      - name: Build OpenFOAM on login node
        run: |
          PS4='+ ${BASH_SOURCE:-bash}:${LINENO}: '
          set -xo pipefail

          mkdir -p "${RESULT_DIR}"
          exec > >(tee "${RESULT_DIR}/build_openfoam.out") 2>&1

          date
          build_root=${OPENFOAM_BUILD_TMP_ROOT}

          module purge
          module load intel/2025.1.3 impi/2021.15

          icx --version
          icpx --version
          mpiicx --version
          mpiicpx --version
          # ccache disabled to avoid temp-dir pressure during parallel builds.
          # ccache --version

          export CC=mpiicx
          export CXX=mpiicpx
          # export CMAKE_C_COMPILER_LAUNCHER=ccache
          # export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          # export CCACHE_LOGFILE=${RESULT_DIR}/ccache-build.log
          # export CCACHE_DEBUG=1
          # export CCACHE_DEBUGDIR=${RESULT_DIR}/ccache-debug
          # mkdir -p ${CCACHE_DEBUGDIR}
          # ccache --show-stats --verbose || true
          # ccache --show-config || true

          cd ${build_root}

          export openfoam_ver=${OPENFOAM_VER}
          source ${build_root}/OpenFOAM-${openfoam_ver}/etc/bashrc \
            WM_COMPILER=Icx \
            WM_MPLIB=INTELMPI \
            WM_LABEL_SIZE=64 \
            WM_PRECISION_OPTION=DP
          set -eu


          cd "$WM_PROJECT_DIR"
          time ./Allwmake -j ${BUILD_PARALLELISM}

          date
          cd "$WM_PROJECT_DIR/applications/solvers/incompressible/simpleFoam"
          time wmake -j ${BUILD_PARALLELISM}

          date
          cd "$WM_PROJECT_DIR/applications/solvers/basic/potentialFoam"
          time wmake -j ${BUILD_PARALLELISM}

          command -v simpleFoam
          command -v potentialFoam

          # ccache disabled; keep the old summary calls commented for rollback.
          date
          # ccache --show-stats || true
          # ccache --show-stats --verbose || true

      - name: Move OpenFOAM build into place
        run: |
          set -uo pipefail

          mkdir -p $(dirname ${OPENFOAM_BUILD_ROOT})
          mv ${OPENFOAM_BUILD_TMP_ROOT} ${OPENFOAM_BUILD_ROOT}
          echo "OpenFOAM build root: ${OPENFOAM_BUILD_ROOT}"

      - name: Submit OpenFOAM case job
        run: |
          set -uo pipefail

          mkdir -p "${RESULT_DIR}"
          case_log="${RESULT_DIR}/allrun.out"
          rm -f "${case_log}"

          job_submit_output="$(
            pjsub \
              -L "rscgrp=a-batch,node=1,elapse=00:10:00" \
              -X \
              -j \
              -o "${case_log}" <<'PJM' 2>&1
          #!/bin/bash

          PS4='+ ${BASH_SOURCE:-bash}:${LINENO}: '
          set -xo pipefail

          cat "$0"

          module purge
          module load intel/2025.1.3 impi/2021.15

          export CC=mpiicx
          export CXX=mpiicpx
          # export CCACHE_LOGFILE=${RESULT_DIR}/ccache-case.log
          export openfoam_ver=${OPENFOAM_VER}
          source ${OPENFOAM_BUILD_ROOT}/OpenFOAM-${openfoam_ver}/etc/bashrc \
            WM_COMPILER=Icx \
            WM_MPLIB=INTELMPI \
            WM_LABEL_SIZE=64 \
            WM_PRECISION_OPTION=DP
          set -eu

          command -v simpleFoam

          tutorial_src="${FOAM_TUTORIALS}/incompressible/simpleFoam/airFoil2D"
          case_dir="${RESULT_DIR}/cases/simpleFoam-airFoil2D"

          test -d "${tutorial_src}"
          rm -rf "${case_dir}"
          mkdir -p "$(dirname "${case_dir}")"
          cp -a "${tutorial_src}" "${case_dir}"
          cd "${case_dir}"
          foamDictionary system/controlDict -entry endTime -set 100
          foamDictionary system/controlDict -entry writeInterval -set 50

          ./Allrun
          PJM
          )"

          printf '%s\n' "${job_submit_output}"

          job_id="$(printf '%s\n' "${job_submit_output}" | grep -oE '[0-9]+' | tail -n 1)"
          if [ -z "${job_id}" ]; then
            echo "failed to parse pjsub job id" >&2
            exit 1
          fi
          echo "Submitted PJM job id: ${job_id}"

          touch "${case_log}"
          tail -n +1 -F "${case_log}" &
          tail_pid=$!
          trap 'kill "${tail_pid}" 2>/dev/null || true' EXIT

          pjwait_output="$(pjwait "${job_id}")"
          echo "${pjwait_output}"
          read -r waited_job_id pjm_exit_code case_exit_code signal_no <<< "${pjwait_output}"

          pjstat --data -H -S "${job_id}" || pjstat -H -S "${job_id}" || true
          kill "${tail_pid}" 2>/dev/null || true
          wait "${tail_pid}" 2>/dev/null || true
          trap - EXIT

          echo "OpenFOAM case result: job=${waited_job_id} pc=${pjm_exit_code} ec=${case_exit_code} signal=${signal_no}"
          if [ "${pjm_exit_code}" != "0" ]; then
            exit "${pjm_exit_code}"
          fi
          exit "${case_exit_code}"

      - name: Upload OpenFOAM outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-outputs-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ env.RESULT_DIR }}

      - name: Cleanup temporary build root
        if: always()
        run: |
          set -uo pipefail

          rm -rf "${OPENFOAM_BUILD_TMP_ROOT}" "${OPENFOAM_BUILD_ROOT}"

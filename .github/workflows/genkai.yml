name: OpenFOAM on genkai

on:
  workflow_dispatch:
    inputs:
      require_build:
        description: Build from source instead of reusing the nearest build archive from the first-parent history
        required: true
        default: false
        type: boolean
      reshare_ccache:
        description: Build from source and republish local ccache hits to remote storage
        required: true
        default: false
        type: boolean
      profile_mode:
        description: Profiler used for the simpleFoam stage
        required: true
        default: perf-stat
        type: choice
        options:
          - none
          - perf-stat
          - vtune-hotspots
      existing_profile_run_id:
        description: Existing Genkai profile run ID to re-export instead of running OpenFOAM
        required: false
        default: ''
        type: string
  push:
    paths-ignore:
      - 'research/**'
      - '**/.md'

permissions:
  actions: read
  contents: read

env:
  BUILD_ARCHIVE_DIR: /home/pj26000080/share/openfoam-build/builds
  GIT_MIRROR_DIR: /fast/pj26000080/git-mirror

defaults:
  run:
    shell: bash --login -eo pipefail {0}

jobs:
  select-build:
    name: Select OpenFOAM build
    if: github.event_name != 'workflow_dispatch' || inputs.existing_profile_run_id == ''
    runs-on: [self-hosted, genkai]

    outputs:
      action: ${{ steps.select.outputs.action }}
      source_run_number: ${{ steps.select.outputs.source_run_number }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select an existing archive or a new build
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ '${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[require-build]')) || (github.event_name == 'workflow_dispatch' && (inputs.require_build || inputs.reshare_ccache)) }}' == true ]]; then
            echo "A new OpenFOAM build was explicitly requested"
            echo "action=build" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          commit="${GITHUB_SHA}"
          while [[ -n "${commit}" ]]
          do
            while IFS=$'\t' read -r run_id run_number
            do
              [[ "${run_id}" != "${GITHUB_RUN_ID}" ]] || continue
              [[ -s "${BUILD_ARCHIVE_DIR}/${run_number}.tar.zst" ]] || continue
              archive_step_count="$(gh run view "${run_id}" --json jobs --jq '[.jobs[].steps[] | select((.name == "Archive OpenFOAM build" or .name == "Build and publish OpenFOAM" or .name == "Hardlink the selected archive") and .conclusion == "success")] | length')"
              [[ "${archive_step_count}" -gt 0 ]] || continue
              echo "Selected ${BUILD_ARCHIVE_DIR}/${run_number}.tar.zst"
              echo "action=reuse" >> "${GITHUB_OUTPUT}"
              echo "source_run_number=${run_number}" >> "${GITHUB_OUTPUT}"
              exit 0
            done < <(gh run list --workflow genkai.yml --commit "${commit}" --limit 20 --json databaseId,number --jq '.[] | [.databaseId, .number] | @tsv')
            commit="$(git rev-parse "${commit}^" 2>/dev/null || true)"
          done

          echo "No reusable OpenFOAM build archive was found; falling back to a new build"
          echo "action=build" >> "${GITHUB_OUTPUT}"

  republish-vtune-timeline:
    name: Republish existing VTune timeline
    if: github.event_name == 'workflow_dispatch' && inputs.existing_profile_run_id != ''
    runs-on: [self-hosted, genkai]
    permissions:
      contents: write

    steps:
      - name: Checkout trace exporter
        uses: actions/checkout@v6

      - name: Export and publish chronological VTune trace
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_RUN_ID: ${{ inputs.existing_profile_run_id }}
        run: |
          module purge
          module load intel/2025.1.3 impi

          profile_dir="${HOME}/openfoam-profile/${PROFILE_RUN_ID}"
          profile_label="mpi-1node-120ranks-shm-default"
          test -d "${profile_dir}/${profile_label}"

          provision_dir="$(mktemp -d "/dev/shm/vtune-republish-${GITHUB_RUN_ID}.XXXXXXXX")"
          trap 'rm -rf -- "${provision_dir:?}"' EXIT
          mkdir -p \
            "${provision_dir}/scripts" \
            "${provision_dir}/logs" \
            "${provision_dir}/browser-summary"
          install -m 0755 \
            "${GITHUB_WORKSPACE}/scripts/export-vtune-summary.sh" \
            "${GITHUB_WORKSPACE}/scripts/vtune-to-trace.py" \
            "${GITHUB_WORKSPACE}/scripts/vtune-summary-to-markdown.py" \
            "${provision_dir}/scripts/"

          OPENFOAM_PROFILE_DIR="${profile_dir}" \
          OPENFOAM_PROFILE_LABEL="${profile_label}" \
          OPENFOAM_PYTHON="$(command -v python3)" \
          PROVISION_DIR="${provision_dir}" \
            "${provision_dir}/scripts/export-vtune-summary.sh"

          release_tag="vtune-latest"
          trace_path="${provision_dir}/browser-summary/openfoam-vtune-trace.json"
          gh release upload "${release_tag}" "${trace_path}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          "${provision_dir}/scripts/vtune-summary-to-markdown.py" \
            --summary "${provision_dir}/browser-summary/summary.json" \
            --output "${GITHUB_STEP_SUMMARY}" \
            --trace-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/vtune-latest/openfoam-vtune-trace.json"
          {
            printf '\nFull VTune data remains on Genkai:\n\n'
            printf -- '- `%s`\n' "${profile_dir}"
          } >> "${GITHUB_STEP_SUMMARY}"

  reuse-build:
    name: Reuse OpenFOAM build
    needs: select-build
    if: needs.select-build.outputs.action == 'reuse'
    runs-on: [self-hosted, genkai]

    steps:
      - name: Hardlink the selected archive
        run: ln -f -- "${BUILD_ARCHIVE_DIR}/${{ needs.select-build.outputs.source_run_number }}.tar.zst" "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.tar.zst"

  build-openfoam:
    name: Build OpenFOAM
    needs: select-build
    if: needs.select-build.outputs.action == 'build'
    runs-on: [self-hosted, genkai]

    concurrency:
      group: genkai-openfoam-build
      queue: single

    env:
      BUILD_DIR: /dev/shm/openfoam-build/run-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_ARCHIVE_CACHE_DIR: /home/pj26000080/share/openfoam-build/source-cache

    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v6

      - name: Build and publish OpenFOAM
        run: |
          if [[ '${{ github.event_name == 'workflow_dispatch' && inputs.reshare_ccache }}' == true ]]; then
            export CCACHE_RESHARE=true
          fi
          "${GITHUB_WORKSPACE}/scripts/build-openfoam.sh"

      - name: Print build failure diagnostics
        if: failure()
        run: |
          for log_path in "${BUILD_DIR}"/logs/*.log; do
            [[ -f "${log_path}" ]] || continue
            printf '\n==> %s <==\n' "${log_path}"
            tail -n 200 "${log_path}"
          done

      - name: Cleanup OpenFOAM build directory
        if: always()
        run: |
          : "${BUILD_DIR:?}"
          [[ -d "${BUILD_DIR}" ]] || exit 0
          rm -rf -- "${BUILD_DIR:?}"

  provision:
    name: Provision OpenFOAM runtime
    needs: [select-build, reuse-build, build-openfoam]
    if: >-
      always() &&
      needs.select-build.result == 'success' &&
      ((needs.select-build.outputs.action == 'reuse' && needs.reuse-build.result == 'success') ||
       (needs.select-build.outputs.action == 'build' && needs.build-openfoam.result == 'success'))
    runs-on: [self-hosted, genkai]

    outputs:
      provision_dir: ${{ steps.provision_runtime.outputs.provision_dir }}

    env:
      OPENFOAM_RUNTIME_ROOT: /fast/pj26000080/openfoam-provisioning

    steps:
      - name: Checkout runtime files
        uses: actions/checkout@v6

      - name: Provision OpenFOAM runtime
        id: provision_runtime
        run: |
          install -d -m 2775 "${OPENFOAM_RUNTIME_ROOT}"
          provision_dir="$(mktemp -d "${OPENFOAM_RUNTIME_ROOT}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          echo "provision_dir=${provision_dir}" >> "${GITHUB_OUTPUT}"
          mkdir -p \
            "${provision_dir}/scripts" \
            "${provision_dir}/logs" \
            "${provision_dir}/browser-summary"
          install -m 0755 \
            "${GITHUB_WORKSPACE}/scripts/run-openfoam.pjm" \
            "${GITHUB_WORKSPACE}/scripts/exec-profiler.sh" \
            "${GITHUB_WORKSPACE}/scripts/export-vtune-summary.sh" \
            "${GITHUB_WORKSPACE}/scripts/vtune-to-trace.py" \
            "${GITHUB_WORKSPACE}/scripts/vtune-summary-to-markdown.py" \
            "${provision_dir}/scripts/"
          cp -a "${GITHUB_WORKSPACE}/experiment-metrics" "${provision_dir}/experiment-metrics"
          uv sync --project "${provision_dir}/experiment-metrics" --frozen --no-dev
          # Keep all installed runtime dependencies, excluding source and build trees.
          tar -I zstd -xf "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_NUMBER}.tar.zst" -C "${provision_dir}" \
            --exclude='*.o' \
            --exclude='*.C' \
            --exclude='*.H' \
            --exclude='*.c' \
            --exclude='*.h' \
            --exclude='./OpenFOAM/src' \
            --exclude='./OpenFOAM/applications' \
            --exclude='./OpenFOAM/wmake' \
            --exclude='./ThirdParty/build' \
            --exclude='./ThirdParty/sources' \
            --exclude='*.cmake' \
            --exclude='CMakeFiles' \
            --exclude='CMakeCache.txt' \
            --exclude='compile_commands.json' \
            --exclude='install_manifest.txt' \
            --exclude='Makefile'
          test -x "${provision_dir}/OpenFOAM/platforms/linux64IcxDPInt64Opt/bin/simpleFoam"

      - name: Cleanup failed OpenFOAM provisioning
        if: failure() && steps.provision_runtime.outputs.provision_dir != ''
        env:
          PROVISION_DIR: ${{ steps.provision_runtime.outputs.provision_dir }}
        run: rm -rf -- "${PROVISION_DIR:?}"

  run:
    name: Run OpenFOAM
    needs: provision
    if: always() && needs.provision.result == 'success'
    runs-on: [self-hosted, genkai]
    permissions:
      actions: read
      contents: write

    env:
      OPENFOAM_RUN_ROOT: /fast/pj26000080/openfoam-runs
      PROVISION_DIR: ${{ needs.provision.outputs.provision_dir }}

    steps:
      - name: Submit OpenFOAM job
        env:
          EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
          OPENFOAM_PROFILE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_mode || 'perf-stat' }}
        run: |
          install -d -m 2775 "${OPENFOAM_RUN_ROOT}"
          test -n "${EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON}"
          credentials_base64="$(printf '%s' "${EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON}" | base64 --wrap=0)"
          job_environment="PROVISION_DIR=${PROVISION_DIR},OPENFOAM_RUN_ROOT=${OPENFOAM_RUN_ROOT},GITHUB_RUN_ID=${GITHUB_RUN_ID},GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT},GITHUB_REPOSITORY=${GITHUB_REPOSITORY},GITHUB_SHA=${GITHUB_SHA},OPENFOAM_PROFILE_MODE=${OPENFOAM_PROFILE_MODE},EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_BASE64=${credentials_base64}"
          job_output="$(pjsub -x "${job_environment}" -o "${PROVISION_DIR}/logs/%j.log" -j -N openfoam_run "${PROVISION_DIR}/scripts/run-openfoam.pjm")"
          printf '%s\n' "${job_output}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<< "${job_output}")"
          test -n "${job_id}"
          echo "PJM_JOB_ID=${job_id}" >> "${GITHUB_ENV}"

      - name: Wait for OpenFOAM job to start
        run: |
          while [[ ! -e "${PROVISION_DIR}/logs/${PJM_JOB_ID}.log" ]]; do
            wait_status="$(pjwait -w waitnone "${PJM_JOB_ID}")"
            pjm_code="$(awk 'NR == 1 { print $2 }' <<< "${wait_status}")"
            if [[ -n "${pjm_code}" && "${pjm_code}" != X ]]; then
              printf '%s\n' "${wait_status}"
              echo "PJM job ended before creating ${PROVISION_DIR}/logs/${PJM_JOB_ID}.log" >&2
              exit 1
            fi
            sleep 2
          done
          echo "PJM job log is ready: ${PROVISION_DIR}/logs/${PJM_JOB_ID}.log"

      - name: Stream OpenFOAM execution log
        run: |
          # Keep the complete PJM log for the artifact, but only stream solver
          # progress lines to the Actions console.
          tail --lines=+1 --follow=name "${PROVISION_DIR}/logs/${PJM_JOB_ID}.log" |
            grep --line-buffered -E '^(Time =|ExecutionTime =)' &
          stream_pid=$!
          stop_stream() {
            kill "${stream_pid}" 2>/dev/null || true
            wait "${stream_pid}" 2>/dev/null || true
          }
          trap stop_stream EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          pjwait -z "${PJM_JOB_ID}"
          sleep 1

      - name: Verify OpenFOAM job completion
        run: |
          pjwait "${PJM_JOB_ID}"
          test -e "${PROVISION_DIR}/run-success"

      - name: Collect PJM accounting metrics
        if: always() && env.PJM_JOB_ID != ''
        env:
          EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
        run: |
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" \
            collect scheduler \
            --job-id "${PJM_JOB_ID}"

      - name: Publish direct VTune trace download
        if: success() && inputs.profile_mode == 'vtune-hotspots'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="vtune-latest"
          trace_path="${PROVISION_DIR}/browser-summary/openfoam-vtune-trace.json"
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${trace_path}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${release_tag}" "${trace_path}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Latest OpenFOAM VTune browser trace" \
              --notes "Rolling lightweight VTune trace generated by the Genkai workflow." \
              --prerelease
          fi

      - name: Publish VTune browser summary
        if: success() && inputs.profile_mode == 'vtune-hotspots'
        run: |
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/python" \
            "${PROVISION_DIR}/scripts/vtune-summary-to-markdown.py" \
            --summary "${PROVISION_DIR}/browser-summary/summary.json" \
            --output "${GITHUB_STEP_SUMMARY}" \
            --trace-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/vtune-latest/openfoam-vtune-trace.json"
          profile_dir="$(sed -n 's/^profile_dir=//p' "${PROVISION_DIR}/logs/profile-location.txt")"
          test -d "${profile_dir}"
          test -f "${profile_dir}/motorBike-${PJM_JOB_ID}.tar.zst"
          {
            printf '\nFull VTune data, solver log, and ParaView case remain on Genkai:\n\n'
            printf -- '- `%s`\n' "${profile_dir}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Print failure diagnostics
        if: failure()
        run: |
          for log_path in "${PROVISION_DIR}"/logs/*.log; do
            [[ -f "${log_path}" ]] || continue
            printf '\n==> %s <==\n' "${log_path}"
            tail -n 200 "${log_path}"
          done

      - name: Cleanup provisioned runtime
        if: always()
        run: |
          if [[ -n "${PJM_JOB_ID:-}" ]]; then
            pjdel "${PJM_JOB_ID}" 2>/dev/null || true
            pjwait -z "${PJM_JOB_ID}" || true
          fi
          rm -rf -- "${PROVISION_DIR:?}"

name: ASPIRE-2A OpenFOAM profiling diagnostic

# 一時的な診断用（Issue #57）。BasicのビルドとBasicの4ノードの構成で、OpenFOAM組み込みのprofilingとparProfilingを
# 40 stepで1回流す。提出物の単独スクリプト（submission/openfoam/run）をそのまま使い、solve.pbsだけを
# diagnostics/openfoam-profiling/solve.pbsに差し替える。全rankのuniform/profiling、各processorのboundary、ログ、PBSの記録をartifactへ回収し、
# 作業ディレクトリを削除する。確認が終わったら、このworkflowと診断用スクリプトを削除する。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aspire2a-openfoam-profiling-diagnostic

jobs:
  diagnose:
    name: 4ノードでOpenFOAMのprofilingを流す
    runs-on: [self-hosted, home-lab]
    timeout-minutes: 1440
    defaults:
      run:
        shell: aspire2a-shell --github-shell {0}
    env:
      # main系統のBasicのビルド（SHA-256 895c57266b6d…、最終Basicのrunと同じ）。
      BUILD_ARCHIVE: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/builds/37175425892.tar.zst
    steps:
      - name: スクリプトを取得
        uses: actions/checkout@v7

      - name: ビルド、ケース、スクリプトを作業ディレクトリへ置き、投入する
        run: |
          work="/scratch/users/industry/ai-hpc/apacsc14/openfoam/diagnostics/of-profiling-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "WORK=${work}" >> "${GITHUB_ENV}"
          mkdir -p "${work}/build" "${work}/runs" "${work}/collect"
          tar -I zstd -xf "${BUILD_ARCHIVE}" -C "${work}/build" ./OpenFOAM ./ThirdParty
          cp -a submission/openfoam/run "${work}/"
          install -m 0755 diagnostics/openfoam-profiling/solve.pbs "${work}/run/solve.pbs"
          cp -a benchmark/occDrivAerStaticMesh "${work}/"
          submitted=$(OPENFOAM_DIR="${work}/build" CASE_SOURCE="${work}/occDrivAerStaticMesh" WORK_ROOT="${work}/runs" "${work}/run/submit.sh" 4 basic)
          printf '%s\n' "${submitted}" | tee "${work}/collect/jobs.txt"
          echo "WAIT_JOBS=$(sed -n 's/^prepare=//p; s/^solve=//p' <<< "${submitted}" | tr '\n' ' ')" >> "${GITHUB_ENV}"

      - name: 終了を待つ
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while true; do
            if accounting=$(aspire2a-shell qstat -fx ${WAIT_JOBS}); then failures=0; else failures=$((failures + 1)); [[ "${failures}" -lt 12 ]] || exit 1; sleep 60; continue; fi
            states=$(awk '/^Job Id:/ {id=$3} /job_state = / {print id, $3}' <<< "${accounting}")
            printf '%s\n' "${states}" | tr '\n' ' '
            echo
            if ! grep -qv ' F$' <<< "${states}"; then break; fi
            sleep 120
          done
          awk '/^Job Id:/ {id=$3} /Exit_status = / {print id, $3}' <<< "${accounting}" | tee /dev/stderr | awk '$2 != 0 {bad=1} END {exit bad}'

      - name: ログ、profiling、boundaryを集める
        if: always() && env.WORK != ''
        run: |
          cd "${WORK}"
          for job in ${WAIT_JOBS:-}; do qstat -fx "${job}" > "collect/pbs-${job}.txt" 2>&1 || true; done
          for case_dir in runs/*/; do
            name=$(basename "${case_dir}")
            mkdir -p "collect/${name}"
            cp -a "${case_dir}logFiles" "collect/${name}/" || true
            cp "runs/${name}.prepare.log" "runs/${name}.solve.log" "collect/${name}/" || true
            (cd "${case_dir}" && find . \( -path "./processor*/40/uniform/profiling" -o -path "./processor*/constant/polyMesh/boundary" \) -print0 | tar --null -T - -cf - | tar -xf - -C "${WORK}/collect/${name}") || true
          done
          find collect -name profiling -path "*/uniform/*" | wc -l

      - name: ログとprofilingInfoをrunnerへ回収
        if: always() && env.WORK != ''
        shell: home-lab-shell {0}
        run: aspire2a-shell --pull "${WORK}/collect" "${RUNNER_TEMP}/openfoam-profiling"

      - name: ログとprofilingInfoを保存
        if: always() && env.WORK != ''
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-profiling-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openfoam-profiling
          if-no-files-found: warn

      - name: 作業ディレクトリを削除
        if: always() && env.WORK != ''
        run: |
          if [[ -n "${WAIT_JOBS:-}" ]]; then qdel ${WAIT_JOBS} 2>/dev/null || true; fi
          rm -rf -- "${WORK:?}"

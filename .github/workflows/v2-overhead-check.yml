name: Temporary OpenFOAM v2 overhead check

on:
  workflow_dispatch:
    inputs:
      build_run_number:
        description: Exact OpenFOAM build archive run number
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash --login -eo pipefail {0}

jobs:
  compare:
    name: Compare instrumentation OFF and ON
    runs-on: [self-hosted, genkai]
    timeout-minutes: 90
    env:
      BUILD_ARCHIVE_DIR: /home/pj26000080/share/openfoam-build/builds
      CHECK_ROOT: /fast/pj26000080/openfoam-overhead-checks

    steps:
      - name: Checkout comparison inputs
        uses: actions/checkout@v7

      - name: Provision exact build and case
        id: provision
        run: |
          archive="${BUILD_ARCHIVE_DIR}/${{ inputs.build_run_number }}.tar.zst"
          test -s "${archive}"
          install -d -m 2775 "${CHECK_ROOT}"
          check_dir="$(mktemp -d "${CHECK_ROOT}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXXXX")"
          printf 'check_dir=%s\n' "${check_dir}" >> "${GITHUB_OUTPUT}"
          install -d "${check_dir}/tree" "${check_dir}/task" "${check_dir}/logs"
          tar -I zstd -xf "${archive}" -C "${check_dir}/tree"
          cp -a benchmark/cavity3D-64M "${check_dir}/task/"
          install -m 0755 scripts/v2-overhead-check.pjm "${check_dir}/"
          install -m 0755 benchmark/parse_result.sh "${check_dir}/"
          {
            printf 'schema_version=openfoam-v2-overhead-build/v1\n'
            printf 'build_run_number=%s\n' '${{ inputs.build_run_number }}'
            printf 'archive_size_bytes=%s\n' "$(stat -c '%s' "${archive}")"
            printf 'archive_sha256=%s\n' "$(sha256sum "${archive}" | awk '{print $1}')"
            printf 'repository_sha=%s\n' "${GITHUB_SHA}"
          } > "${check_dir}/build-identity.txt"

      - name: Submit isolated comparison
        run: |
          check_dir='${{ steps.provision.outputs.check_dir }}'
          job_output="$(pjsub -x "CHECK_DIR=${check_dir}" \
            -o "${check_dir}/logs/%j.log" -j -N openfoam_v2_overhead \
            "${check_dir}/v2-overhead-check.pjm")"
          printf '%s\n' "${job_output}"
          job_id="$(sed -n 's/.*Job \([0-9][0-9]*\) submitted.*/\1/p' <<< "${job_output}")"
          test -n "${job_id}"
          printf 'PJM_JOB_ID=%s\n' "${job_id}" >> "${GITHUB_ENV}"

      - name: Wait for comparison
        run: |
          check_dir='${{ steps.provision.outputs.check_dir }}'
          log="${check_dir}/logs/${PJM_JOB_ID}.log"
          while [[ ! -e "${log}" ]]; do
            status="$(pjwait -w waitnone "${PJM_JOB_ID}")"
            code="$(awk 'NR == 1 { print $2 }' <<< "${status}")"
            [[ -z "${code}" || "${code}" == X ]] || { printf '%s\n' "${status}"; exit 1; }
            sleep 2
          done
          tail --lines=+1 --follow=name "${log}" &
          tail_pid=$!
          trap 'kill "${tail_pid}" 2>/dev/null || true' EXIT
          pjwait -z "${PJM_JOB_ID}"
          sleep 1
          pjwait "${PJM_JOB_ID}"
          test -s "${check_dir}/summary.txt"
          printf '%s\n' 'OPENFOAM_V2_OVERHEAD_CHECK_BEGIN'
          cat "${check_dir}/summary.txt"
          printf '%s\n' 'OPENFOAM_V2_OVERHEAD_CHECK_END'

      - name: Upload comparison diagnostics
        if: always() && steps.provision.outputs.check_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-v2-overhead-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.provision.outputs.check_dir }}/logs
            ${{ steps.provision.outputs.check_dir }}/pstream
            ${{ steps.provision.outputs.check_dir }}/build-identity.txt
            ${{ steps.provision.outputs.check_dir }}/workload.sha256
            ${{ steps.provision.outputs.check_dir }}/summary.txt
            ${{ steps.provision.outputs.check_dir }}/diagnostic-status.txt
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Discard comparison data
        if: always()
        run: |
          if [[ -n "${PJM_JOB_ID:-}" ]]; then
            pjdel "${PJM_JOB_ID}" 2>/dev/null || true
            pjwait -z "${PJM_JOB_ID}" || true
          fi
          check_dir='${{ steps.provision.outputs.check_dir }}'
          if [[ -n "${check_dir}" ]]; then
            rm -rf -- "${check_dir:?}"
          fi

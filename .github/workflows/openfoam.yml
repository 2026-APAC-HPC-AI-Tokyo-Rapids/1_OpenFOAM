name: OpenFOAM

on:
  push:
    paths-ignore:
      - "research/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      run_genkai:
        description: Run the Genkai workflow
        required: true
        default: true
        type: boolean
      run_gadi:
        description: Run the Gadi workflow
        required: true
        default: false
        type: boolean
      node_count:
        description: Official experiment node count; the target workflow resolves its rank count
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "4"

permissions:
  actions: write
  contents: read

jobs:
  validate:
    name: Validate control plane
    if: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[cluster:genkai]') || contains(github.event.head_commit.message, '[cluster:gadi]'))) || (github.event_name == 'workflow_dispatch' && (inputs.run_genkai || inputs.run_gadi)) }}
    uses: ./.github/workflows/validate.yml

  genkai:
    name: Genkai
    needs: validate
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:genkai]')) || (github.event_name == 'workflow_dispatch' && inputs.run_genkai) }}
    uses: ./.github/workflows/genkai.yml
    with:
      profile: false
      profile_rank: "0"
      profile_analysis: hotspots
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:2]') && '2' || '1' }}
    secrets: inherit

  gadi:
    name: Gadi
    needs: validate
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:gadi]')) || (github.event_name == 'workflow_dispatch' && inputs.run_gadi) }}
    uses: ./.github/workflows/gadi.yml
    with:
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:2]') && '2' || '1' }}
    secrets: inherit

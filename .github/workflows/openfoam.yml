name: OpenFOAM

# push起動ではコミットメッセージの[cluster:*]、[nodes:*]、[profile]から実験条件を決める。
on:
  push:
    paths-ignore:
      - "research/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      run_genkai:
        description: 玄界用ワークフローを実行する
        required: true
        default: true
        type: boolean
      run_gadi:
        description: Gadi用ワークフローを実行する
        required: true
        default: false
        type: boolean
      run_aspire2a:
        description: ASPIRE-2A用ワークフローを実行する
        required: true
        default: false
        type: boolean
      node_count:
        description: 公式実験のノード数（MPIランク数は各クラスタ用ワークフローで決定）
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
      profile:
        description: 通常計測の代わりに各クラスタの推奨profilerで計測する
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  validate:
    name: 制御処理を検証
    if: ${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[cluster:genkai]') || contains(github.event.head_commit.message, '[cluster:gadi]') || contains(github.event.head_commit.message, '[cluster:aspire2a]'))) || (github.event_name == 'workflow_dispatch' && (inputs.run_genkai || inputs.run_gadi || inputs.run_aspire2a)) }}
    uses: ./.github/workflows/validate.yml

  genkai:
    name: Genkai
    needs: validate
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:genkai]')) || (github.event_name == 'workflow_dispatch' && inputs.run_genkai) }}
    uses: ./.github/workflows/genkai.yml
    with:
      profile: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[profile]')) }}
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:2]') && '2' || '1' }}
    secrets: inherit

  gadi:
    name: Gadi
    needs: validate
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:gadi]')) || (github.event_name == 'workflow_dispatch' && inputs.run_gadi) }}
    uses: ./.github/workflows/gadi.yml
    with:
      profile: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[profile]')) }}
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:2]') && '2' || '1' }}
    secrets: inherit

  aspire2a:
    name: ASPIRE-2A
    needs: validate
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[cluster:aspire2a]')) || (github.event_name == 'workflow_dispatch' && inputs.run_aspire2a) }}
    uses: ./.github/workflows/aspire2a.yml
    with:
      profile: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[profile]')) }}
      node_count: ${{ github.event_name == 'workflow_dispatch' && inputs.node_count || contains(github.event.head_commit.message, '[nodes:4]') && '4' || contains(github.event.head_commit.message, '[nodes:2]') && '2' || '1' }}
    secrets: inherit

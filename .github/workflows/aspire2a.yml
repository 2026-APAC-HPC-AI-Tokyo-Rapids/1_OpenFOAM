name: ASPIRE-2AでOpenFOAMを実行

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: boolean
      node_count:
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  ASPIRE2A_ROOT: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a
  BUILD_ARCHIVE_DIR: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/builds
  SOURCE_ARCHIVE_DIR: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/source-archives
  BUILD_LOG_ROOT: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/build-logs
  AMDUPROF_ARCHIVE: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/tools/AMDuProf_Linux_x64_5.3.521.tar.bz2
  AMDUPROF_ROOT: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/tools/amduprof-5.3.521
  OPENFOAM_SOURCE_OID: 5a55da3fb12800863bf76122c50bb0850222cab0
  THIRDPARTY_SOURCE_OID: 1eb943261ee0c0f7c5ec180dc012ce8d3b8777e0
  IMB_SOURCE_OID: 1a7cada09754be3ccf60c2698305a4c020b52e28

defaults:
  run:
    shell: aspire2a-shell --github-shell {0}

jobs:
  select-build:
    name: OpenFOAMビルドを選択
    runs-on: [self-hosted, home-lab]
    outputs:
      action: ${{ steps.select.outputs.action }}
      source_archive_key: ${{ steps.select.outputs.source_archive_key }}
      build_cache_key: ${{ steps.select.outputs.build_cache_key }}
      openfoam_source_oid: ${{ steps.source.outputs.oid }}
      experiment_preset: ${{ steps.protocol.outputs.experiment_preset }}
      ranks: ${{ steps.protocol.outputs.ranks }}
      prepare_script_sha256: ${{ steps.prepare_identity.outputs.sha256 }}
    steps:
      - name: リポジトリ履歴を取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ケース準備処理を識別
        id: prepare_identity
        run: echo "sha256=$(sha256sum scripts/prepare-openfoam-case.sh | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: 診断用ソースを選択
        id: source
        run: |
          source_oid=${OPENFOAM_SOURCE_OID}
          if [[ '${{ inputs.profile }}' == true ]] && jq -e '.analysis == "mpi_timing" and .diagnostic_iterations == 10' platforms/aspire2a/profile.json >/dev/null; then
            [[ '${{ inputs.node_count }}' == 4 ]] || { echo '10反復診断にはASPIRE-2Aの4ノードを指定してください' >&2; exit 64; }
            source_oid=$(cat platforms/aspire2a/diagnostic-source-oid.txt)
            [[ "${source_oid}" =~ ^[0-9a-f]{40}$ ]]
          fi
          printf 'oid=%s\n' "${source_oid}" >> "${GITHUB_OUTPUT}"
          printf 'OPENFOAM_SOURCE_OID=%s\n' "${source_oid}" >> "${GITHUB_ENV}"

      - name: 実験条件を決定
        id: protocol
        run: |
          case '${{ inputs.node_count }}' in
            1) experiment_preset=aspire2a-multilevel-1n-128r; ranks=128 ;;
            2) experiment_preset=aspire2a-multilevel-2n-256r; ranks=256 ;;
            4) decomposition=$(cat platforms/aspire2a/decomposition-4n.txt); case "${decomposition}" in hierarchical|multilevel) experiment_preset="aspire2a-${decomposition}-4n-512r" ;; weighted) experiment_preset=aspire2a-multilevel-4n-512r ;; *) exit 64 ;; esac; ranks=512 ;;
            *) echo 'ASPIRE-2Aのノード数には1、2、4のいずれかを指定してください' >&2; exit 64 ;;
          esac
          printf 'experiment_preset=%s\nranks=%s\n' "${experiment_preset}" "${ranks}" >> "${GITHUB_OUTPUT}"

      - name: 既存成果物の再利用または新規ビルドを選択
        id: select
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            commit_message="$(git log -1 --format=%B "${GITHUB_SHA}")"
            if [[ "${commit_message}" == '[require-build]'* ]]; then
              echo 'コミットでASPIRE-2A向けOpenFOAMの新規ビルドが指定されました'
              printf 'action=build\nbuild_cache_key=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          while IFS= read -r run_id
          do
            [[ "${run_id}" =~ ^[0-9]+$ && "${run_id}" != "${GITHUB_RUN_ID}" ]] || continue
            archive="${BUILD_ARCHIVE_DIR}/${run_id}.tar.zst"
            sidecar="${BUILD_ARCHIVE_DIR}/${run_id}.build-sidecar.json"
            scripts/build-inputs-match.sh aspire2a "${sidecar}" || continue
            expected_size=$(jq -er 'select(.schema_version == "build-sidecar/v1" and .build_archive.path == "build.tar.zst") | .build_archive.size_bytes' "${sidecar}") || continue
            expected_sha=$(jq -er '.build_archive.sha256' "${sidecar}") || continue
            [[ "$(stat -c '%s' "${archive}")" == "${expected_size}" ]] || continue
            [[ "$(sha256sum "${archive}" | awk '{print $1}')" == "${expected_sha}" ]] || continue
            echo "利用可能な最新のビルドを選択しました: ${archive}"
            printf 'action=reuse\nsource_archive_key=%s\nbuild_cache_key=%s\n' "${run_id}" "${run_id}" >> "${GITHUB_OUTPUT}"
            exit 0
          done < <(find "${BUILD_ARCHIVE_DIR}" -maxdepth 1 -type f -name '*.build-sidecar.json' -printf '%f\n' 2>/dev/null | sed 's/[.]build-sidecar[.]json$//' | LC_ALL=C sort -rn)
          echo '再利用可能なASPIRE-2A向け成果物がないため、新しくビルドします'
          printf 'action=build\nbuild_cache_key=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  reuse-build:
    name: OpenFOAMビルドを再利用
    needs: select-build
    if: needs.select-build.outputs.action == 'reuse'
    runs-on: [self-hosted, home-lab]
    steps:
      - name: 選択した成果物をハードリンク
        run: |
          source_key='${{ needs.select-build.outputs.source_archive_key }}'
          ln -f -- "${BUILD_ARCHIVE_DIR}/${source_key}.tar.zst" "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_ID}.tar.zst"
          ln -f -- "${BUILD_ARCHIVE_DIR}/${source_key}.build-sidecar.json" "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_ID}.build-sidecar.json"

  build-openfoam:
    name: OpenFOAMをビルド
    needs: select-build
    if: needs.select-build.outputs.action == 'build'
    runs-on: [self-hosted, home-lab]
    steps:
      - name: ビルド入力を取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ソース圧縮ファイルを配置
        id: stage
        env:
          OPENFOAM_SOURCE_OID: ${{ needs.select-build.outputs.openfoam_source_oid }}
        run: |
          # 非公開source repositoryは、意図的にASPIRE-2A login runnerへ設定したgh認証で取得する。
          source_archive_run_dir="${SOURCE_ARCHIVE_DIR}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0750 "${source_archive_run_dir}"
          echo "SOURCE_ARCHIVE_RUN_DIR=${source_archive_run_dir}" >> "${GITHUB_ENV}"
          openfoam_oid=${OPENFOAM_SOURCE_OID}
          if [[ "${openfoam_oid}" == 5a55da3fb12800863bf76122c50bb0850222cab0 ]]; then
            test "$(gh api repos/2026-APAC-HPC-AI-Tokyo-Rapids/3_OpenFOAM_Src/git/ref/tags/OpenFOAM-v2512 --jq .object.sha)" = "${openfoam_oid}"
          fi
          thirdparty_oid=$(gh api repos/2026-APAC-HPC-AI-Tokyo-Rapids/4_OpenFOAM_ThirdParty_Src/git/ref/tags/v2512 --jq .object.sha)
          test "${thirdparty_oid}" = "${THIRDPARTY_SOURCE_OID}"
          [[ "${openfoam_oid}" =~ ^[0-9a-f]{40}$ && "${thirdparty_oid}" =~ ^[0-9a-f]{40}$ ]]
          openfoam_archive="${source_archive_run_dir}/${openfoam_oid}.openfoam.tar.gz"
          thirdparty_archive="${source_archive_run_dir}/${thirdparty_oid}.thirdparty.tar.gz"
          imb_archive="${source_archive_run_dir}/${IMB_SOURCE_OID}.imb.tar.gz"
          gh api "repos/2026-APAC-HPC-AI-Tokyo-Rapids/3_OpenFOAM_Src/tarball/${openfoam_oid}" > "${openfoam_archive}.tmp"
          gh api "repos/2026-APAC-HPC-AI-Tokyo-Rapids/4_OpenFOAM_ThirdParty_Src/tarball/${thirdparty_oid}" > "${thirdparty_archive}.tmp"
          gh api "repos/intel/mpi-benchmarks/tarball/${IMB_SOURCE_OID}" > "${imb_archive}.tmp"
          mv -f -- "${openfoam_archive}.tmp" "${openfoam_archive}"
          mv -f -- "${thirdparty_archive}.tmp" "${thirdparty_archive}"
          mv -f -- "${imb_archive}.tmp" "${imb_archive}"
          tar -tzf "${openfoam_archive}" >/dev/null
          tar -tzf "${thirdparty_archive}" >/dev/null
          tar -tzf "${imb_archive}" >/dev/null
          printf 'openfoam_archive=%s\nopenfoam_archive_sha256=%s\nopenfoam_oid=%s\nthirdparty_archive=%s\nthirdparty_archive_sha256=%s\nthirdparty_oid=%s\nimb_archive=%s\nimb_archive_sha256=%s\nimb_oid=%s\n' "${openfoam_archive}" "$(sha256sum "${openfoam_archive}" | awk '{print $1}')" "${openfoam_oid}" "${thirdparty_archive}" "$(sha256sum "${thirdparty_archive}" | awk '{print $1}')" "${thirdparty_oid}" "${imb_archive}" "$(sha256sum "${imb_archive}" | awk '{print $1}')" "${IMB_SOURCE_OID}" >> "${GITHUB_OUTPUT}"

      - name: OpenFOAMをビルドして保存
        env:
          OPENFOAM_SOURCE_ARCHIVE: ${{ steps.stage.outputs.openfoam_archive }}
          OPENFOAM_SOURCE_ARCHIVE_SHA256: ${{ steps.stage.outputs.openfoam_archive_sha256 }}
          OPENFOAM_SOURCE_OID: ${{ steps.stage.outputs.openfoam_oid }}
          THIRDPARTY_SOURCE_ARCHIVE: ${{ steps.stage.outputs.thirdparty_archive }}
          THIRDPARTY_SOURCE_ARCHIVE_SHA256: ${{ steps.stage.outputs.thirdparty_archive_sha256 }}
          THIRDPARTY_SOURCE_OID: ${{ steps.stage.outputs.thirdparty_oid }}
          IMB_SOURCE_ARCHIVE: ${{ steps.stage.outputs.imb_archive }}
          IMB_SOURCE_ARCHIVE_SHA256: ${{ steps.stage.outputs.imb_archive_sha256 }}
          IMB_SOURCE_OID: ${{ steps.stage.outputs.imb_oid }}
        run: |
          build_log_dir="${BUILD_LOG_ROOT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0750 "${build_log_dir}"
          exported="ASPIRE2A_BUILD_LOG_DIR=${build_log_dir},BUILD_ARCHIVE_DIR=${BUILD_ARCHIVE_DIR},GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT},GITHUB_RUN_ID=${GITHUB_RUN_ID},GITHUB_WORKSPACE=${GITHUB_WORKSPACE},OPENFOAM_SOURCE_ARCHIVE=${OPENFOAM_SOURCE_ARCHIVE},OPENFOAM_SOURCE_ARCHIVE_SHA256=${OPENFOAM_SOURCE_ARCHIVE_SHA256},OPENFOAM_SOURCE_OID=${OPENFOAM_SOURCE_OID},THIRDPARTY_SOURCE_ARCHIVE=${THIRDPARTY_SOURCE_ARCHIVE},THIRDPARTY_SOURCE_ARCHIVE_SHA256=${THIRDPARTY_SOURCE_ARCHIVE_SHA256},THIRDPARTY_SOURCE_OID=${THIRDPARTY_SOURCE_OID},IMB_SOURCE_ARCHIVE=${IMB_SOURCE_ARCHIVE},IMB_SOURCE_ARCHIVE_SHA256=${IMB_SOURCE_ARCHIVE_SHA256},IMB_SOURCE_OID=${IMB_SOURCE_OID}"
          job_id=$(qsub -v "${exported}" -o "${build_log_dir}/pbs.log" -j oe "${GITHUB_WORKSPACE}/platforms/aspire2a/build-openfoam.pbs")
          [[ "${job_id}" =~ ^[0-9]+([.][A-Za-z0-9.-]+)?$ ]]
          echo "ASPIRE2A_BUILD_JOB_ID=${job_id}" >> "${GITHUB_ENV}"
          echo "ASPIRE2A_BUILD_LOG_DIR=${build_log_dir}" >> "${GITHUB_ENV}"
          "${GITHUB_WORKSPACE}/platforms/aspire2a/wait-pbs-job.sh" "${job_id}"
          test -f "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_ID}.tar.zst"
          test -f "${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_ID}.build-sidecar.json"

      - name: OpenFOAMビルドログをrunnerへ回収
        if: always()
        continue-on-error: true
        shell: home-lab-shell {0}
        run: aspire2a-shell --pull "${ASPIRE2A_BUILD_LOG_DIR}" "${RUNNER_TEMP}/openfoam-aspire2a-build"

      - name: OpenFOAMビルドログを保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-aspire2a-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openfoam-aspire2a-build
          if-no-files-found: warn
          compression-level: 1

      - name: OpenFOAMビルド領域を削除
        if: always()
        run: |
          if [[ -n "${ASPIRE2A_BUILD_JOB_ID:-}" ]]; then qdel "${ASPIRE2A_BUILD_JOB_ID}" 2>/dev/null || true; fi
          if [[ -n "${ASPIRE2A_BUILD_LOG_DIR:-}" ]]; then rm -rf -- "${ASPIRE2A_BUILD_LOG_DIR:?}"; fi
          if [[ -n "${SOURCE_ARCHIVE_RUN_DIR:-}" ]]; then rm -rf -- "${SOURCE_ARCHIVE_RUN_DIR:?}"; fi

  provision:
    name: OpenFOAM実行環境を配備
    needs: [select-build, reuse-build, build-openfoam]
    if: always() && needs.select-build.result == 'success' && ((needs.select-build.outputs.action == 'build' && needs.build-openfoam.result == 'success') || (needs.select-build.outputs.action == 'reuse' && needs.reuse-build.result == 'success'))
    runs-on: [self-hosted, home-lab]
    outputs:
      provision_dir: ${{ steps.provision.outputs.provision_dir }}
    steps:
      - name: 実行用ファイルを取得
        uses: actions/checkout@v7

      - name: OpenFOAM実行環境を配備
        id: provision
        run: |
          if [[ '${{ inputs.profile }}' == true ]] && [[ $(jq -r '.analysis' platforms/aspire2a/profile.json) == hotspots ]]; then platforms/aspire2a/provision-uprof.sh "${AMDUPROF_ARCHIVE}" "${AMDUPROF_ROOT}"; fi
          provision_root="${ASPIRE2A_ROOT}/provision"
          install -d -m 0750 "${provision_root}"
          provision_dir=$(mktemp -d "${provision_root}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXX")
          printf 'provision_dir=%s\n' "${provision_dir}" >> "${GITHUB_OUTPUT}"
          install -d "${provision_dir}/benchmark" "${provision_dir}/control" "${provision_dir}/scripts" "${provision_dir}/platforms/aspire2a"
          archive="${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_ID}.tar.zst"
          sidecar="${BUILD_ARCHIVE_DIR}/${GITHUB_RUN_ID}.build-sidecar.json"
          platforms/aspire2a/provision-openfoam-runtime.sh "${archive}" "${sidecar}" "${provision_dir}"
          install -m 0644 "${sidecar}" "${provision_dir}/control/build-sidecar.json"
          install -m 0755 scripts/run-openfoam.sh scripts/prepare-openfoam-case.sh scripts/check-openfoam-case-cache.sh "${provision_dir}/scripts/"
          install -m 0755 platforms/aspire2a/run-openfoam.pbs platforms/aspire2a/prepare-openfoam-case.pbs platforms/aspire2a/wait-pbs-job.sh platforms/aspire2a/stage-openfoam-runtime.sh platforms/aspire2a/archive-openfoam-case.sh platforms/aspire2a/stage-openfoam-case.sh platforms/aspire2a/stage-rank-context.sh platforms/aspire2a/collect-rank-placement.sh platforms/aspire2a/exec-uprof.sh platforms/aspire2a/exec-mpi-temporal-profile.sh platforms/aspire2a/export-uprof.sh platforms/aspire2a/export-craypat.sh "${provision_dir}/platforms/aspire2a/"
          install -m 0644 platforms/aspire2a/toolchain.conf platforms/aspire2a/toolchain.sh platforms/aspire2a/decomposition-4n.txt "${provision_dir}/platforms/aspire2a/"
          install -m 0644 platforms/aspire2a/write-decomposition-weights.c "${provision_dir}/platforms/aspire2a/"
          source platforms/aspire2a/toolchain.conf
          source platforms/aspire2a/toolchain.sh
          aspire2a_load_toolchain "${aspire2a_toolchain}"
          cc -O2 -Wall -Wextra -Werror -fPIC -shared -Wl,-z,defs -o "${provision_dir}/platforms/aspire2a/libmpi-rank-affinity.so" platforms/aspire2a/mpi-rank-affinity.c
          cc -O2 -Wall -Wextra -Werror -std=c11 -o "${provision_dir}/platforms/aspire2a/exec-uprof-target" platforms/aspire2a/exec-uprof-target.c
          cc -O2 -Wall -Wextra -Werror -std=c11 -o "${provision_dir}/platforms/aspire2a/write-decomposition-weights" platforms/aspire2a/write-decomposition-weights.c
          if [[ '${{ inputs.profile }}' == true ]] && [[ $(jq -r '.analysis' platforms/aspire2a/profile.json) == mpi_timing ]]; then cc -O2 -Wall -Wextra -Werror -std=c11 -fPIC -shared -Wl,-z,defs -o "${provision_dir}/platforms/aspire2a/libmpi-temporal-profile.so" platforms/aspire2a/mpi-temporal-profile.c -ldl; fi
          ldd "${provision_dir}/platforms/aspire2a/libmpi-rank-affinity.so" > "${provision_dir}/control/mpi-rank-affinity-ldd.log"
          grep -Eq '/opt/cray/pe/(mpich/.*/lib|lib64)/libmpi' "${provision_dir}/control/mpi-rank-affinity-ldd.log"
          if grep -q '/oneapi/' "${provision_dir}/control/mpi-rank-affinity-ldd.log"; then printf '%s\n' 'ASPIRE-2A用MPI affinity interposerがIntel oneAPIにlinkしています' >&2; exit 1; fi
          install -m 0755 benchmark/parse_result.sh "${provision_dir}/benchmark/"
          cp -a benchmark/occDrivAerStaticMesh "${provision_dir}/benchmark/"
          if [[ '${{ inputs.profile }}' == true ]]; then install -m 0644 platforms/aspire2a/profile.json "${provision_dir}/benchmark/profile.json"; else install -m 0644 benchmark/profile.json "${provision_dir}/benchmark/profile.json"; fi
          install -m 0644 benchmark/workload.json "${provision_dir}/benchmark/workload.json"
          cp -a experiment-metrics "${provision_dir}/experiment-metrics"
          uv sync --project "${provision_dir}/experiment-metrics" --frozen --no-dev --no-editable
          tar --use-compress-program='zstd -T0 -3' -cf "${provision_dir}/compute-tools.tar.zst" -C "${provision_dir}" experiment-metrics scripts platforms/aspire2a
          jq -n -c --arg path compute-tools.tar.zst --argjson size_bytes "$(stat -c '%s' "${provision_dir}/compute-tools.tar.zst")" --arg sha256 "$(sha256sum "${provision_dir}/compute-tools.tar.zst" | awk '{print $1}')" '{schema_version:"openfoam-compute-tools-archive/v1",archive:{path:$path,size_bytes:$size_bytes,sha256:$sha256}}' > "${provision_dir}/control/compute-tools.json"

      - name: 配備失敗時のOpenFOAM実行環境を削除
        if: failure() && steps.provision.outputs.provision_dir != ''
        env:
          PROVISION_DIR: ${{ steps.provision.outputs.provision_dir }}
        run: rm -rf -- "${PROVISION_DIR:?}"

  prepare-case:
    name: OpenFOAMケースのキャッシュを準備
    needs: [select-build, provision]
    if: always() && needs.provision.result == 'success'
    runs-on: [self-hosted, home-lab]
    concurrency:
      group: aspire2a-openfoam-case-${{ needs.select-build.outputs.ranks }}-${{ needs.select-build.outputs.prepare_script_sha256 }}-${{ needs.select-build.outputs.build_cache_key }}
    env:
      PROVISION_DIR: ${{ needs.provision.outputs.provision_dir }}
    steps:
      - name: 未作成のメッシュを配置・検証・領域分割
        run: |
          prepare_root="${ASPIRE2A_ROOT}/prepare/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          prepare_cache_root="${ASPIRE2A_ROOT}/case-archives"
          workload_dir="${ASPIRE2A_ROOT}/workload"
          workload_archive="${workload_dir}/polyMesh_65M.tar.gz"
          workload_temporary="${workload_archive}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tmp"
          install -d -m 0750 "${prepare_root}" "${prepare_cache_root}" "${workload_dir}"
          trap 'rm -f -- "${workload_temporary}"' EXIT
          if [[ ! -f "${workload_archive}" || "$(stat -c '%s' "${workload_archive}")" != "$(jq -r '.mesh.size_bytes' "${PROVISION_DIR}/benchmark/workload.json")" || "$(sha256sum "${workload_archive}" | awk '{print $1}')" != "$(jq -r '.mesh.sha256' "${PROVISION_DIR}/benchmark/workload.json")" ]]; then
            curl --fail --location --retry 3 "$(jq -r '.mesh.url' "${PROVISION_DIR}/benchmark/workload.json")" --output "${workload_temporary}"
            test "$(stat -c '%s' "${workload_temporary}")" = "$(jq -r '.mesh.size_bytes' "${PROVISION_DIR}/benchmark/workload.json")"
            test "$(md5sum "${workload_temporary}" | awk '{print $1}')" = "$(jq -r '.mesh.md5' "${PROVISION_DIR}/benchmark/workload.json")"
            test "$(sha256sum "${workload_temporary}" | awk '{print $1}')" = "$(jq -r '.mesh.sha256' "${PROVISION_DIR}/benchmark/workload.json")"
            mv -- "${workload_temporary}" "${workload_archive}"
          fi
          trap - EXIT
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "${status}" -ne 0 ]]; then qdel "${job_id:-}" 2>/dev/null || true; cat "${prepare_root}/pbs.log" 2>/dev/null || true; rm -rf -- "${PROVISION_DIR:?}"; fi
            rm -rf -- "${prepare_root}"
            exit "${status}"
          }
          trap cleanup EXIT
          if "${PROVISION_DIR}/scripts/check-openfoam-case-cache.sh" aspire2a "${PROVISION_DIR}" "${{ needs.select-build.outputs.ranks }}" "${prepare_cache_root}" "${workload_archive}"; then
            exit 0
          else
            test "$?" -eq 75
          fi
          exported="PREPARE_CACHE_ROOT=${prepare_cache_root},PREPARE_SUBDOMAINS=${{ needs.select-build.outputs.ranks }},PROVISION_DIR=${PROVISION_DIR},WORKLOAD_MESH_ARCHIVE=${workload_archive}"
          job_id=$(qsub -P 59000014 -q normal -l select=1:ncpus=4:mpiprocs=1:mem=120gb -v "${exported}" -o "${prepare_root}/pbs.log" -j oe -N openfoam_prepare "${PROVISION_DIR}/platforms/aspire2a/prepare-openfoam-case.pbs")
          [[ "${job_id}" =~ ^[0-9]+([.][A-Za-z0-9.-]+)?$ ]]
          "${PROVISION_DIR}/platforms/aspire2a/wait-pbs-job.sh" "${job_id}"
          cache_dir=$(sed -n 's/^cache_dir=//p' "${prepare_root}/pbs.log" | tail -n 1)
          [[ "${cache_dir}" == "${prepare_cache_root}/"* ]]

  run:
    name: OpenFOAMを実行
    needs: [select-build, provision, prepare-case]
    if: always() && needs.provision.result == 'success' && needs.prepare-case.result == 'success'
    runs-on: [self-hosted, home-lab]
    outputs:
      artifact_uploaded: ${{ steps.upload_v2.outcome == 'success' }}
      profile_run_id: ${{ steps.v2_context.outputs.profile_run_id }}
      run_dir: ${{ steps.v2_context.outputs.run_dir }}
    env:
      PROVISION_DIR: ${{ needs.provision.outputs.provision_dir }}
      OPENFOAM_RUN_ROOT: /scratch/users/industry/ai-hpc/apacsc14/openfoam/aspire2a/runs
    steps:
      - name: 制御処理の識別情報を取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 計測記録を初期化してOpenFOAMを投入
        id: v2_context
        env:
          METRICS_CREDENTIAL_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
        run: |
          install -d -m 0750 "${OPENFOAM_RUN_ROOT}"
          test -n "${METRICS_CREDENTIAL_JSON}"
          credential_file=$(mktemp "/tmp/openfoam-bigquery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXX.json")
          printf '%s' "${METRICS_CREDENTIAL_JSON}" > "${credential_file}"
          trap 'rm -f -- "${credential_file}"' EXIT
          export EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE="${credential_file}"
          export EXPERIMENT_METRICS_BIGQUERY_CONFIG="${PROVISION_DIR}/experiment-metrics/pyproject.toml"
          uv sync --project "${PROVISION_DIR}/experiment-metrics" --frozen --no-dev --extra publish
          protocol_relative="experiment-metrics/registry/openfoam-v2-protocol-${{ needs.select-build.outputs.experiment_preset }}.toml"
          protocol_path="${PROVISION_DIR}/${protocol_relative}"
          if [[ '${{ inputs.profile }}' == true ]]; then
            purpose=profile
            profile_analysis=$(jq -er '.analysis' "${PROVISION_DIR}/benchmark/profile.json")
            if [[ "${profile_analysis}" == mpi ]]; then profile_tool=craypat; bundle_path="${GITHUB_WORKSPACE}/experiment-metrics/bundles/openfoam-profile-craypat-mpi-v1.json"; elif [[ "${profile_analysis}" == mpi_timing ]]; then profile_tool=mpi_timing; bundle_path="${GITHUB_WORKSPACE}/experiment-metrics/bundles/openfoam-profile-mpi-timing-v1.json"; else profile_tool=uprof; bundle_path="${GITHUB_WORKSPACE}/experiment-metrics/bundles/openfoam-profile-uprof-hotspots-v1.json"; fi
            printf 'OPENFOAM_PROFILE_ANALYSIS=%s\nOPENFOAM_PROFILE_TOOL=%s\n' "${profile_analysis}" "${profile_tool}" >> "${GITHUB_ENV}"
          else
            purpose=bench
            profile_tool=uprof
            bundle_path="${GITHUB_WORKSPACE}/experiment-metrics/bundles/openfoam-score-v1.json"
          fi
          printf 'profile_tool=%s\n' "${profile_tool}" >> "${GITHUB_OUTPUT}"
          bundle_sha256=$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" bundle-identity --bundle "${bundle_path}" --purpose "${purpose}")
          head_commit=$(git rev-parse HEAD)
          base_commit=$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || printf '%s' "${head_commit}")
          control_plane_files=(.github/workflows/aspire2a.yml .github/workflows/openfoam.yml benchmark/parse_result.sh benchmark/profile.json benchmark/workload.json "${protocol_relative}" experiment-metrics/registry/openfoam-v2.toml experiment-metrics/src/experiment_metrics/cli.py experiment-metrics/src/experiment_metrics/imb.py experiment-metrics/src/experiment_metrics/pbs_scheduler.py experiment-metrics/src/experiment_metrics/rank_wrapper.py platforms/aspire2a/archive-openfoam-case.sh platforms/aspire2a/decomposition-4n.txt platforms/aspire2a/diagnostic-source-oid.txt platforms/aspire2a/mpi-rank-affinity.c platforms/aspire2a/prepare-openfoam-case.pbs platforms/aspire2a/profile.json platforms/aspire2a/provision-openfoam-runtime.sh platforms/aspire2a/run-openfoam.pbs platforms/aspire2a/stage-openfoam-case.sh platforms/aspire2a/stage-openfoam-runtime.sh platforms/aspire2a/toolchain.conf platforms/aspire2a/toolchain.sh platforms/aspire2a/wait-pbs-job.sh platforms/aspire2a/write-decomposition-weights.c scripts/check-openfoam-case-cache.sh scripts/prepare-openfoam-case.sh scripts/run-openfoam.sh)
          if [[ "${purpose}" == profile && "${profile_tool}" == uprof ]]; then control_plane_files+=(experiment-metrics/src/experiment_metrics/profile_uprof.py platforms/aspire2a/exec-uprof-target.c platforms/aspire2a/exec-uprof.sh platforms/aspire2a/export-uprof.sh platforms/aspire2a/provision-uprof.sh); fi
          if [[ "${purpose}" == profile && "${profile_tool}" == craypat ]]; then control_plane_files+=(platforms/aspire2a/export-craypat.sh); fi
          if [[ "${purpose}" == profile && "${profile_tool}" == mpi_timing ]]; then control_plane_files+=(platforms/aspire2a/exec-mpi-temporal-profile.sh platforms/aspire2a/mpi-temporal-profile.c experiment-metrics/src/experiment_metrics/provision.py); fi
          readarray -t control_plane_files < <(printf '%s\n' "${control_plane_files[@]}" | LC_ALL=C sort -u)
          control_plane_args=()
          for control_plane_file in "${control_plane_files[@]}"; do control_plane_args+=(--control-plane-file "${control_plane_file}"); done
          identities=$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" source-track-identities --repository "${GITHUB_WORKSPACE}" --purpose "${purpose}" --base-commit "${base_commit}" --instrumentation-bundle-sha256 "${bundle_sha256}" "${control_plane_args[@]}")
          manifest=$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" init-run --runtime-root "${OPENFOAM_RUN_ROOT}" --purpose "${purpose}" --identities-json "${identities}" --repository-id apac2026-openfoam --instrumentation-bundle "${bundle_path}" --registry "${PROVISION_DIR}/experiment-metrics/registry/openfoam-v2.toml")
          run_dir=$(dirname "$(dirname "${manifest}")")
          run_id=$(basename "${run_dir}")
          install -m 0644 "${PROVISION_DIR}/control/build-sidecar.json" "${run_dir}/control/build-sidecar.json"
          cp -a "${PROVISION_DIR}/control/build-raw" "${run_dir}/control/build-raw"
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" record-artifact-index --manifest "${manifest}" --runtime-dir "${run_dir}" --build-sidecar "${run_dir}/control/build-sidecar.json"
          printf 'run_id=%s\nmanifest=%s\nrun_dir=%s\n' "${run_id}" "${manifest}" "${run_dir}" >> "${GITHUB_OUTPUT}"
          printf 'RUN_ID=%s\nRUN_MANIFEST=%s\nRUN_DIR=%s\nOPENFOAM_PROTOCOL_PATH=%s\nEXPERIMENT_METRICS_BIGQUERY_CONFIG=%s\n' "${run_id}" "${manifest}" "${run_dir}" "${protocol_path}" "${PROVISION_DIR}/experiment-metrics/pyproject.toml" >> "${GITHUB_ENV}"
          export RUN_ID="${run_id}"
          export RUN_MANIFEST="${manifest}"
          export RUN_DIR="${run_dir}"
          export OPENFOAM_PROTOCOL_PATH="${protocol_path}"
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" smoke-send --run "${RUN_ID}" --source runner
          cd "${RUN_DIR}"
          job_id=$("${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" submit-pbs-run --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" --protocol "${OPENFOAM_PROTOCOL_PATH}" --pbs-script-repository-path platforms/aspire2a/run-openfoam.pbs --execution-script "${PROVISION_DIR}/platforms/aspire2a/run-openfoam.pbs" --provision-dir "${PROVISION_DIR}" --profile-tool "${profile_tool}" --profile-condition "${PROVISION_DIR}/benchmark/profile.json")
          [[ "${job_id}" =~ ^[0-9]+([.][A-Za-z0-9.-]+)?$ ]]
          echo "PBS_JOB_ID=${job_id}" >> "${GITHUB_ENV}"
          echo "pbs_job_id=${job_id}" >> "${GITHUB_OUTPUT}"
          echo "profile_run_id=${run_id}-${job_id}" >> "${GITHUB_OUTPUT}"

      - name: OpenFOAMジョブの終了を待機
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          success_failures=0
          while true
          do
            if accounting=$(aspire2a-shell qstat -fx "${PBS_JOB_ID}"); then
              failures=0
            else
              failures=$((failures + 1))
              [[ "${failures}" -lt 12 ]] || { printf 'PBS状態の取得に12回連続で失敗しました: %s\n' "${PBS_JOB_ID}" >&2; exit 1; }
              sleep 30
              continue
            fi
            state=$(sed -n 's/^[[:space:]]*job_state = //p' <<< "${accounting}")
            [[ "${state}" =~ ^[A-Z]$ ]]
            printf 'job_id=%s state=%s\n' "${PBS_JOB_ID}" "${state}"
            if [[ "${state}" == F ]]; then
              exit_status=$(sed -n 's/^[[:space:]]*Exit_status = //p' <<< "${accounting}")
              [[ "${exit_status}" =~ ^-?[0-9]+$ ]]
              printf 'job_id=%s state=%s exit_status=%s\n' "${PBS_JOB_ID}" "${state}" "${exit_status}"
              [[ "${exit_status}" -eq 0 ]]
              if aspire2a-shell test -e "${RUN_DIR}/run-success"; then break; fi
              success_failures=$((success_failures + 1))
              [[ "${success_failures}" -lt 12 ]] || { printf 'run-successを12回連続で確認できませんでした: %s\n' "${RUN_DIR}" >&2; exit 1; }
            else
              case "${state}" in Q|H|R|B|E) ;; *) printf '未対応のPBSジョブ状態です: %s\n' "${state}" >&2; exit 65 ;; esac
            fi
            sleep 30
          done

      - name: AMD uProf reportをlogin nodeで生成
        if: success() && inputs.profile && steps.v2_context.outputs.profile_tool == 'uprof'
        env:
          OPENFOAM_NODES: ${{ inputs.node_count }}
          OPENFOAM_MPI_PROCS: ${{ needs.select-build.outputs.ranks }}
        run: |
          analysis=$(jq -er '.analysis | select(. == "hotspots" or . == "assess" or . == "data_access")' "${PROVISION_DIR}/benchmark/profile.json")
          "${PROVISION_DIR}/platforms/aspire2a/export-uprof.sh" "${AMDUPROF_ROOT}/bin/AMDuProfCLI-bin" "${RUN_DIR}/profile/raw/uprof" "${analysis}"
          sed 's/^/uprof_/' "${RUN_DIR}/profile/raw/uprof/session.txt" >> "${RUN_DIR}/logs/profile-location.txt"

      - name: AMD uProf結果を構造化
        if: success() && inputs.profile && steps.v2_context.outputs.profile_tool == 'uprof'
        run: |
          analysis=$(jq -er '.analysis | select(. == "hotspots" or . == "assess" or . == "data_access")' "${PROVISION_DIR}/benchmark/profile.json")
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" record-profile-uprof --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" --report-root "${RUN_DIR}/profile/raw/uprof/reports" --expected-hosts '${{ inputs.node_count }}' --expected-ranks '${{ needs.select-build.outputs.ranks }}' --uprof-rank-stride 16 --analysis-type "${analysis}" --summary "${RUN_DIR}/results/uprof-summary.json" --markdown "${RUN_DIR}/results/uprof-summary.md"

      - name: AMD uProf概要をActionsの概要へ掲載
        if: success() && inputs.profile && steps.v2_context.outputs.profile_tool == 'uprof'
        run: |
          cat "${RUN_DIR}/results/uprof-summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: CrayPAT MPI reportをlogin nodeで生成
        if: success() && inputs.profile && steps.v2_context.outputs.profile_tool == 'craypat'
        run: |
          "${PROVISION_DIR}/platforms/aspire2a/export-craypat.sh" "${RUN_DIR}/profile/raw/craypat" "${PROVISION_DIR}/runtime.tar.zst" "${PROVISION_DIR}/control/build-sidecar.json"
          grep -E '^Table [0-9]+:' "${RUN_DIR}/profile/raw/craypat/pat-report.txt" >> "${GITHUB_STEP_SUMMARY}"

      - name: 計測記録を確定して成果物を梱包
        id: package_v2
        if: always() && steps.v2_context.outputs.pbs_job_id != ''
        env:
          METRICS_CREDENTIAL_JSON: ${{ secrets.EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_JSON }}
        run: |
          test -n "${METRICS_CREDENTIAL_JSON}"
          credential_file=$(mktemp "/tmp/openfoam-bigquery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXXXX.json")
          printf '%s' "${METRICS_CREDENTIAL_JSON}" > "${credential_file}"
          trap 'rm -f -- "${credential_file}"' EXIT
          export EXPERIMENT_METRICS_GOOGLE_CREDENTIALS_FILE="${credential_file}"
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" record-pbs-terminal --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" --protocol "${OPENFOAM_PROTOCOL_PATH}" --job-id "${PBS_JOB_ID}" || true
          if jq -e '.diagnostic_iterations == 0' "${RUN_DIR}/control/scheduler-request.json" >/dev/null; then
            "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" record-solver-log --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" --log "${RUN_DIR}/logs/solver.log" --protocol "${OPENFOAM_PROTOCOL_PATH}" --coefficient "${RUN_DIR}/results/coefficient.dat" || true
          fi
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" record-execution-context --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}" --protocol "${OPENFOAM_PROTOCOL_PATH}" --host-snapshot "${RUN_DIR}/source/env/host-exec.snapshot" --placement-root "${RUN_DIR}/source/placement" --scheduler-request "${RUN_DIR}/control/scheduler-request.json" --scheduler-accounting "${RUN_DIR}/control/scheduler-accounting.json" --decompose-dict "${RUN_DIR}/source/mesh/decomposeParDict" --solver-log "${RUN_DIR}/logs/solver.log" || true
          args=(package --manifest "${RUN_MANIFEST}")
          result_member_role=official_result
          if jq -e '.diagnostic_iterations > 0' "${RUN_DIR}/control/scheduler-request.json" >/dev/null; then result_member_role=postrun_source; fi
          for pair in 'control/run-manifest.json:run_manifest' 'control/instrumentation-bundle.json:instrumentation_bundle' 'control/build-sidecar.json:build_sidecar' 'control/build-provision-validation.json:build_provision_validation' 'control/job-entry.json:job_entry' 'control/scheduler-accounting.json:scheduler_accounting' 'control/scheduler-request.json:scheduler_request' 'control/scheduler-terminal.json:scheduler_terminal' 'control/submission-result.json:scheduler_submission_result' 'logs/checkMesh.log:check_mesh_log' 'logs/imb-mpi1-ldd.log:postrun_source' 'logs/mpi-rank-affinity-ldd.log:postrun_source' 'logs/minimal-hardware-capture.log:postrun_source' 'logs/profile-hardware-capture.log:postrun_source' 'logs/rank-placement.log:postrun_source' 'logs/decomposePar.log:decompose_par_log' 'logs/renumberMesh.log:renumber_mesh_log' 'logs/potentialFoam.log:potential_foam_log' 'logs/applyBoundaryLayer.log:apply_boundary_layer_log' 'logs/profile-warmup.log:postrun_source' 'logs/pbs.log:pbs_log' 'logs/solver.log:solver_log' 'results/coefficient.dat:force_coefficients' 'results/coefficient-source.json:postrun_source' 'source/env/host-exec.snapshot:host_exec_environment' 'source/env/job-entry.snapshot:job_entry_environment' 'source/network/imb-mpi1/argv.json:imb_mpi1_argv' 'source/network/imb-mpi1/stderr.txt:imb_mpi1_stderr' 'source/network/imb-mpi1/stdout.txt:imb_mpi1_stdout' 'source/scheduler/accounting.stderr:scheduler_accounting_stderr' 'source/scheduler/accounting.stdout:scheduler_accounting_stdout' 'source/scheduler/submission.stderr:scheduler_submission_stderr' 'source/scheduler/submission.stdout:scheduler_submission_stdout'; do relative=${pair%%:*}; [[ -f "${RUN_DIR}/${relative}" ]] && args+=(--member "${pair}"); done
          [[ -f "${RUN_DIR}/results/result.txt" ]] && args+=(--member "results/result.txt:${result_member_role}")
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:rank_placement"); done < <(find "${RUN_DIR}/source/placement" -type f -name 'rank-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:minimal_hardware"); done < <(find "${RUN_DIR}/source/hardware" -type f -name 'node-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:postrun_source"); done < <(find "${RUN_DIR}/source/hardware" -type f ! -name 'node-*.json' -print0 | sort -z)
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:postrun_source"); done < <(find "${RUN_DIR}/source/mesh" "${RUN_DIR}/source/build-provision" -type f -print0 | sort -z)
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:build_raw"); done < <(find "${RUN_DIR}/control/build-raw" -type f -print0 | sort -z)
          args+=(--member 'source/workload-manifest.json:workload_manifest')
          while IFS= read -r -d '' path; do args+=(--member "${path#"${RUN_DIR}/"}:workload_member"); done < <(find "${RUN_DIR}/source/workload" -type f -print0 | sort -z)
          if [[ '${{ inputs.profile }}' == true ]]; then
            [[ -f "${RUN_DIR}/results/uprof-summary.json" ]] && args+=(--member 'results/uprof-summary.json:postrun_source')
            [[ -f "${RUN_DIR}/results/uprof-summary.md" ]] && args+=(--member 'results/uprof-summary.md:postrun_source')
            while IFS= read -r -d '' path; do args+=(--profile-member "${path#"${RUN_DIR}/"}"); done < <(find "${RUN_DIR}/profile/raw" -type f -print0 | sort -z)
          fi
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" "${args[@]}"
          "${PROVISION_DIR}/experiment-metrics/.venv/bin/experiment-metrics" send-fragments --manifest "${RUN_MANIFEST}" --runtime-dir "${RUN_DIR}"

      - name: 固定構成のv2成果物をrunnerへ回収
        if: always() && steps.v2_context.outputs.pbs_job_id != ''
        shell: home-lab-shell {0}
        env:
          REMOTE_RUN_DIR: ${{ steps.v2_context.outputs.run_dir }}
        run: |
          destination="${RUNNER_TEMP}/openfoam-aspire2a-run"
          aspire2a-shell --pull "${REMOTE_RUN_DIR}/artifact-manifest.json" "${destination}"
          aspire2a-shell --pull "${REMOTE_RUN_DIR}/run-artifacts.tar.zst" "${destination}"
          if [[ '${{ inputs.profile }}' == true ]]; then
            aspire2a-shell --pull "${REMOTE_RUN_DIR}/profile-raw.tar.zst" "${destination}"
          fi

      - name: 固定構成のv2成果物を保存
        id: upload_v2
        if: always() && steps.v2_context.outputs.pbs_job_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-aspire2a-v2-${{ steps.v2_context.outputs.run_id }}
          path: |
            ${{ runner.temp }}/openfoam-aspire2a-run/artifact-manifest.json
            ${{ runner.temp }}/openfoam-aspire2a-run/run-artifacts.tar.zst
            ${{ runner.temp }}/openfoam-aspire2a-run/profile-raw.tar.zst
          if-no-files-found: error
          compression-level: 0

      - name: occDrivAerStaticMeshの結果をrunnerへ回収
        if: success()
        shell: home-lab-shell {0}
        env:
          REMOTE_RUN_DIR: ${{ steps.v2_context.outputs.run_dir }}
        run: aspire2a-shell --pull "${REMOTE_RUN_DIR}/results" "${RUNNER_TEMP}/openfoam-aspire2a-run"

      - name: occDrivAerStaticMeshの結果を保存
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openfoam-aspire2a-occdrivaer-65m-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openfoam-aspire2a-run/results
          if-no-files-found: error
          compression-level: 0

      - name: 配備した実行環境を削除
        if: always()
        run: |
          if [[ -n "${PBS_JOB_ID:-}" ]]; then qdel "${PBS_JOB_ID}" 2>/dev/null || true; fi
          rm -rf -- "${PROVISION_DIR:?}"

  archive-artifacts:
    name: 成果物を自宅サーバーへ保管
    needs: run
    if: always() && needs.run.outputs.artifact_uploaded == 'true'
    runs-on: [self-hosted, home-lab]
    defaults:
      run:
        shell: home-lab-shell {0}
    permissions:
      actions: write
      contents: read
    env:
      OPENFOAM_ARTIFACT_ARCHIVE_ROOT: /hdd_raid/samba/net_share/openfoam-artifacts
    steps:
      - name: 成果物保管処理を取得
        uses: actions/checkout@v7

      - name: ワークフロー成果物を取得
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "openfoam-aspire2a-*"
      - name: 成果物を自宅サーバーへ配置
        run: |
          destination="${OPENFOAM_ARTIFACT_ARCHIVE_ROOT}/${GITHUB_RUN_ID}/aspire2a"
          install -d -m 0750 "${destination}"
          cp -a artifacts/. "${destination}/"

      - name: 保管済み成果物をマニフェストと照合
        id: archive_verify
        run: |
          set -euo pipefail
          destination="${OPENFOAM_ARTIFACT_ARCHIVE_ROOT}/${GITHUB_RUN_ID}/aspire2a"
          for bundle in "${destination}"/openfoam-aspire2a-v2-*; do
            manifest="${bundle}/artifact-manifest.json"
            jq -e --argjson profile '${{ inputs.profile }}' '.schema_version == "artifact-manifest/v1" and ([.files[].role] | sort) == (if $profile then ["profile_raw", "run_bundle"] else ["run_bundle"] end)' "${manifest}" >/dev/null
            while IFS=$'\t' read -r role expected_size expected_sha; do
              case "${role}" in run_bundle) member=run-artifacts.tar.zst ;; profile_raw) member=profile-raw.tar.zst ;; *) exit 2 ;; esac
              test "$(stat -c '%s' "${bundle}/${member}")" = "${expected_size}"
              test "$(sha256sum "${bundle}/${member}" | awk '{print $1}')" = "${expected_sha}"
            done < <(jq -r '.files[] | [.role, .size_bytes, .sha256] | @tsv' "${manifest}")
          done

      - name: 保管済みのクラスタruntimeを削除
        if: steps.archive_verify.outcome == 'success'
        env:
          RUN_DIR: ${{ needs.run.outputs.run_dir }}
        run: scripts/remove-openfoam-runtime.sh --cluster aspire2a --connection aspire2a-shell --run-dir "${RUN_DIR}"

      - name: 転送済みのGitHub成果物を削除
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("openfoam-aspire2a-")) | .id' | while read -r artifact_id; do gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"; done
